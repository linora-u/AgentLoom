name: "shell_worker"
agent_runtime: smolagents
runtime_options:
  smart_summary: false
description: |
  一个工作 agent，负责演示 shell 的持久性和独立性。
model_type: "powerful"
task: |
  # Shell Worker Workflow
  1. 接收 supervisor 的指令
  2. 使用 bash/shell 工具执行对应的 cd, pwd 等命令
  3. 必须返回真实的指令执行结果

input_schema:
  type: object
  properties:
    query:
      type: string
      description: '传递给 worker 的具体 shell 执行指令或任务描述。

        '
  required:
  - query
  additionalProperties: false
tools:
  - name: "shell_tool"

worker_agents: []
