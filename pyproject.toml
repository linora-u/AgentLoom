[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "AgentLoom"
version = "1.0.0"
description = "Simple, flexible workflow orchestration for multi-agent AI applications"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.12"
authors = [
    {name = "lin"},
]
keywords = ["agent", "workflow", "ai", "llm", "smolagents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core framework
    "smolagents[litellm,mcp,openai,telemetry]==1.21.1",
    "litellm>=1.72.0",
    # Monitoring and tracing
    "langfuse>=2.0.0,<3.0.0",
    "opentelemetry-sdk==1.26.0",
    "opentelemetry-exporter-otlp==1.26.0",
    "openinference-instrumentation>=0.1.42",
    "openinference-instrumentation-smolagents>=0.1.4",
    "sentry-sdk>=2.35.1",
    # Config and logging
    "pyyaml>=6.0.0",
    "pydantic>=2.7.0",
    "rich>=14.2.0",
    "tenacity>=9.1.2",
    # Network and IO
    "httpx>=0.27.2",
    "requests>=2.32.3",
    "aiohttp>=3.11.11",
    "beautifulsoup4>=4.14.2",
    # Code analysis
    "tree-sitter>=0.25.2",
    "tree-sitter-c==0.23.1",
    "tree-sitter-bash>=0.25.1",
    "libclang>=18.1.1",
    "ast-grep-cli>=0.40.5",
    "ripgrep>=15.0.0",
    "networkx>=3.0,<4.0",
    "grep-ast>=0.3.0",
    "tree-sitter-language-pack>=0.13.0",
    "serena-agent>=1.0.0",
    "go-bin>=1.23",
    "nodejs-bin[cmd]>=18.0",
    "pathspec>=0.12.0",
    # CLI
    "click>=8.1.0",
    # Visualization server
    "flask>=3.0.0",
    # Misc tools
    "GitPython>=3.1.43",
    "docker>=7.1.0",
    "fire>=0.7.0",
    "arrow>=1.3.0",
    "snowflake-id>=1.0.2",
    "datasets>=3.6.0",
    "packaging>=24.2",
    "python-frontmatter>=1.1.0",
    "mermaid-syntax-parser>=0.2.2",
    "sandbox-fusion>=0.1.0",
    "websocket-client>=1.9.0",
    "ruff>=0.3.0",
    "shellcheck-py>=0.10.0.1",
    "diff-match-patch>=20241021",
    # Platform specific
    "pexpect>=4.9.0",
    "wexpect>=4.0.0 ; sys_platform == 'win32'",
    "textual",
]

[project.urls]
Homepage = "https://github.com/linora-u/AgentLoom#readme"
Repository = "https://github.com/linora-u/AgentLoom"
Issues = "https://github.com/linora-u/AgentLoom/issues"
Documentation = "https://github.com/linora-u/AgentLoom/tree/main/docs/en"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "pytest-mock>=3.12.0",
]
lint = [
    "black>=24.0.0",
    "mypy>=1.8.0",
]

[project.scripts]
loom = "src.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
src = ["**/*.yaml", "**/*.yml", "**/*.j2", "**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-v", "--tb=short"]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.ruff]
line-length = 120
target-version = "py312"
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
]

[tool.uv]
prerelease = "allow"
