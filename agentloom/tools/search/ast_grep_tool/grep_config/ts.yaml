id: export function
language: typescript
rule:
  all:
    - kind: export_statement
    - has:
        all:
          - kind: function_declaration
          - has:
              field: name
              regex: ^{WORDS}$
---
id: function
language: typescript
rule:
  all:
    - kind: function_declaration
    - has:
        field: name
        regex: ^{WORDS}$
    - not:
        inside:
          kind: export_statement
---
id: variable arrow function
language: typescript
rule:
  all:
    - kind: lexical_declaration
    - has:
        all:
          - kind: variable_declarator
          - has:
              field: name
              regex: ^{WORDS}$
          - has:
              field: value
              kind: arrow_function
---
id: variable function expression
language: typescript
rule:
  kind: lexical_declaration
  regex: \b(?:const|let|var)\s+{WORDS}\s*=\s*(?:async\s+)?function\b
