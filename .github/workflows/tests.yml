name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # The fixed-point memory benchmark is intentionally bound to a
          # historical reference commit and must not be skipped in CI.
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Prepare test LLM config
        run: cp config/llm.example.yaml config/llm.yaml

      - name: Run tests
        env:
          PYTHONPATH: .
        run: >-
          uv run pytest tests/
          applications/memory_feature_validation/scripts/test_memory_review_campaign_capsule.py
          applications/memory_feature_validation/scripts/test_memory_review_campaign_contract.py
          -v --tb=short --color=yes
