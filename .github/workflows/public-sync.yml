name: Public repository sync

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Private PR number; leave empty to resume all ready PRs
        required: false
        type: string
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: private-to-public-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Synchronize public repository
    if: >-
      github.repository == 'linora-u/AgentLoom-private' &&
      (github.event_name != 'pull_request_target' ||
       (!github.event.pull_request.draft &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Find ready private PRs
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&base=main&per_page=100" --jq '[.[] | select(.draft == false and .head.repo.full_name == .base.repo.full_name)] | length')
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Check out trusted coordinator
        if: steps.pending.outputs.count != '0'
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          sparse-checkout: .github

      - name: Configure public-repository deploy key
        if: steps.pending.outputs.count != '0'
        env:
          PUBLIC_SYNC_SSH_KEY: ${{ secrets.PUBLIC_SYNC_SSH_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$PUBLIC_SYNC_SSH_KEY"
          umask 077
          printf '%s\n' "$PUBLIC_SYNC_SSH_KEY" > "$RUNNER_TEMP/public-sync-key"
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$RUNNER_TEMP/public-sync-known-hosts"
          echo "GIT_SSH_COMMAND=ssh -i $RUNNER_TEMP/public-sync-key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/public-sync-known-hosts" >> "$GITHUB_ENV"

      - name: Publish public changes before merging private PRs
        if: steps.pending.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_SYNC_TOKEN }}
          SYNC_PR_NUMBER: ${{ inputs.pr_number }}
        run: python .github/scripts/public_sync.py

      - name: Remove temporary deploy key
        if: always()
        run: rm -f "$RUNNER_TEMP/public-sync-key" "$RUNNER_TEMP/public-sync-known-hosts"
