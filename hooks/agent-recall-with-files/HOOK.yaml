name: agent-recall-with-files
description: File-backed task context and cross-session recall lifecycle hooks.
hooks:
  TaskCreated:
    - id: agent-recall-with-files.task-created
      command: python ./scripts/on_task_start.py
      timeout: 20
  TaskCompleted:
    - id: agent-recall-with-files.task-completed
      command: python ./scripts/on_task_complete.py
      timeout: 20
  StopFailure:
    - id: agent-recall-with-files.stop-failure
      command: python ./scripts/on_task_fail.py
      timeout: 20
  SubagentStart:
    - id: agent-recall-with-files.subagent-start
      command: python ./scripts/on_subtask_start.py
      timeout: 20
  SubagentStop:
    - id: agent-recall-with-files.subagent-stop
      command: python ./scripts/on_subtask_finish.py
      timeout: 20
  PreToolUse:
    - id: agent-recall-with-files.pre-tool-use
      matcher: "write_file|edit_file|shell_tool|read_file|glob_search|grep_search"
      command: python ./scripts/on_pre_tool_use.py
      timeout: 20
  PostToolUse:
    - id: agent-recall-with-files.post-tool-use
      matcher: "write_file|edit_file|shell_tool|read_file|glob_search|grep_search"
      command: python ./scripts/on_post_tool_use.py
      timeout: 20
  Stop:
    - id: agent-recall-with-files.stop
      command: python ./scripts/on_stop.py
      timeout: 20
