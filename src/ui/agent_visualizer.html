<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent 执行可视化系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/agent.css">
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col">

<!-- ═══════════════════ 标题栏 ═══════════════════ -->
<header class="flex justify-between items-center px-4 py-2.5 card-bg border-b border-slate-700 shadow-xl z-20 gap-4 shrink-0">
    <div class="flex items-center gap-3 shrink-0">
        <div class="w-2 h-2 rounded-full bg-emerald-400 shadow-[0_0_8px_#10b981]"></div>
        <h1 class="text-lg font-bold bg-clip-text text-transparent bg-gradient-to-r from-emerald-400 to-blue-500 whitespace-nowrap">
            <span data-i18n="title">Agent 执行可视化</span>
        </h1>
        <!-- SSE 实时状态 -->
        <div id="sse-badge" class="hidden items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-emerald-900/50 border border-emerald-600 text-emerald-300 text-xs font-medium">
            <div class="w-2 h-2 rounded-full bg-emerald-400 sse-dot sse-pulse"></div>
            <span data-i18n="liveSync">实时同步中</span>
        </div>
        <div id="sse-error" class="hidden items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-red-900/50 border border-red-600 text-red-300 text-xs font-medium">
            <div class="w-2 h-2 rounded-full bg-red-400"></div>
            <span data-i18n="disconnected">连接断开</span>
        </div>
    </div>

    <div class="flex items-center gap-2 flex-wrap justify-end">

        <!-- 手动步骤翻阅（查历史用） -->
        <div class="flex items-center gap-1 bg-slate-900 border border-slate-700 rounded-lg p-1">
            <button id="btn-prev" data-i18n-title="prevStep" title="上一步 (←)" class="px-3 py-1 bg-slate-700 hover:bg-slate-600 rounded text-sm transition font-medium">◀</button>
            <span id="step-badge" class="text-xs text-slate-400 px-2 tabular-nums whitespace-nowrap">Step 0/0</span>
            <button id="btn-next" data-i18n-title="nextStep" title="下一步 (→)" class="px-3 py-1 bg-slate-700 hover:bg-slate-600 rounded text-sm transition font-medium">▶</button>
            <button id="btn-latest" data-i18n-title="jumpLatest" title="跳到最新 (End)" class="px-3 py-1 bg-teal-700 hover:bg-teal-600 rounded text-xs transition font-medium"><span data-i18n="latest">最新</span></button>
        </div>

        <!-- 本地 JSON -->
        <label data-i18n-title="loadLocal" title="加载本地 JSON 文件" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded text-sm cursor-pointer transition flex items-center gap-1.5 font-medium border border-slate-600">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
            <span data-i18n="localJSON">本地 JSON</span>
            <input type="file" id="file-input" class="hidden" accept=".json,.log">
        </label>

        <!-- 服务器文件列表 -->
        <div class="relative" id="server-menu-wrapper">
            <button id="btn-server" class="px-3 py-1.5 bg-blue-700 hover:bg-blue-600 rounded text-sm transition flex items-center gap-1.5 font-medium border border-blue-600">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M12 5l7 7-7 7"/></svg>
                <span data-i18n="server">服务器</span>
            </button>
            <div id="server-panel" class="p-4">
                <div class="flex justify-between items-center mb-3">
                    <span class="text-sm font-bold text-slate-200" data-i18n="logFiles">后端日志文件</span>
                    <div class="flex gap-2">
                        <button id="btn-server-latest" class="text-xs px-2 py-1 bg-emerald-700 hover:bg-emerald-600 rounded transition"><span data-i18n="loadLatest">加载最新</span></button>
                        <button id="btn-server-refresh" class="text-xs px-2 py-1 bg-slate-600 hover:bg-slate-500 rounded transition"><span data-i18n="refreshList">刷新列表</span></button>
                    </div>
                </div>
                <div id="server-log-list" class="max-h-60 overflow-y-auto space-y-1 text-sm">
                    <p class="text-slate-500 text-xs text-center py-4" data-i18n="logListHint">点击"刷新列表"获取文件</p>
                </div>
                <p id="server-error" class="hidden mt-2 text-xs text-red-400 bg-red-900/30 px-2 py-1 rounded"></p>
            </div>
        </div>

        <!-- 语言切换 -->
        <button id="btn-lang" title="切换语言 / Switch Language"
                class="px-2.5 py-1.5 bg-slate-700 hover:bg-slate-600 rounded text-xs font-bold transition border border-slate-600 text-slate-200 tracking-wide">
            中
        </button>

        <!-- 全屏 -->
        <button id="btn-fullscreen" data-i18n-title="fullscreen" title="全屏 (F)" class="w-8 h-8 flex items-center justify-center bg-slate-700 hover:bg-slate-600 rounded transition border border-slate-600">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
        </button>
    </div>
</header>

<!-- ═══════════════════ 内容区（左侧面板 + 舞台） ═══════════════════ -->
<div class="flex-1 flex overflow-hidden min-h-0">

<!-- ═══════════════════ 左侧面板 ═══════════════════ -->
<aside id="left-panel" class="relative shrink-0 card-bg border-r border-slate-700 flex flex-col z-10 shadow-[4px_0_20px_rgba(0,0,0,0.3)] overflow-hidden transition-[width] duration-300" style="width:300px;">

    <!-- 折叠 Tab 按钮 -->
    <button id="btn-collapse-panel" data-i18n-title="collapsePanel" title="折叠/展开面板 (P)"
            class="absolute right-0 top-1/2 -translate-y-1/2 z-20 w-[18px] h-14 bg-slate-700 hover:bg-slate-500 border-l border-slate-600 rounded-l-none flex items-center justify-center text-slate-300 text-[10px] font-bold shadow-xl transition select-none">
        ◀
    </button>

    <!-- 内容包裹层（折叠时隐藏） -->
    <div id="panel-content" class="flex flex-col flex-1 overflow-hidden min-h-0 transition-opacity duration-200" style="width:100%;">
        <!-- 进度条 -->
        <div id="progress-section" class="p-3 border-b border-slate-800 shrink-0">
            <div class="flex items-center text-[13px] mb-2">
                <span id="progress-text" class="text-slate-400 font-medium">等待数据...</span>
            </div>
            <div id="progress-bar-wrap" class="w-full h-2 bg-slate-800 rounded-full overflow-hidden border border-slate-700 cursor-pointer" title="点击跳转">
                <div id="progress-bar" class="h-full bg-gradient-to-r from-emerald-500 to-teal-400 w-0 transition-all duration-300 relative">
                    <div class="absolute inset-0 bg-white/20 animate-pulse"></div>
                </div>
            </div>
        </div>
        <!-- 日志 -->
        <div id="log-section" class="flex-1 p-3 flex flex-col overflow-hidden min-h-0">
            <div id="log-panel" class="flex-1 log-bg rounded-lg border border-slate-700 p-3 overflow-y-auto font-mono text-[13px] leading-relaxed space-y-1.5 shadow-inner"></div>
        </div>
    </div>
</aside>

<!-- 可拖拽宽度调节器 -->
<div id="panel-resizer" title="拖拽调整宽度"></div>

<!-- ═══════════════════ 主舞台 ═══════════════════ -->
<main id="main-viewport" class="flex-1 overflow-auto bg-[#0f172a] relative min-h-0 select-none" style="cursor:grab;">
    <div id="stage" style="min-width:100%; min-height:100%; position:relative;
         background-image:radial-gradient(#1e293b 1px,transparent 1px);
         background-size:30px 30px; display:flex; align-items:center; justify-content:center;">
        <svg id="svg-layer" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;"></svg>
        <div id="agents-container" style="position:relative;z-index:10;
             display:flex;align-items:center;justify-content:center;
             padding:60px 80px;">
            <div id="orbital-stage" style="position:relative;"></div>
        </div>
    </div>
</main>

</div><!-- end content wrapper -->

<script src="js/state.js"></script>
<script src="js/i18n.js"></script>
<script src="js/animations.js"></script>
<script src="js/scene.js"></script>
<script src="js/timeline.js"></script>
<script src="js/controls.js"></script>
<script src="js/network.js"></script>
<script src="js/main.js"></script>
</body>
</html>
