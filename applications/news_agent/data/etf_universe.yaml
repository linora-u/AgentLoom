etf_dk_merge:
  benchmark_policy: exact_or_proxy
  output_dir: etf_dk_merge
  primary_keys:
    - ts_code
    - trade_date
  # SQLite-only derived ETF liquidity and primary-market flow metrics.
  # fund_daily.vol is in hands and total_share is in ten-thousand shares,
  # therefore vol / total_share is the turnover percentage.
  derived_fields:
    turnover_rate: 'ETF换手率(%): vol / total_share'
    share_change: 'ETF份额净变化(万份): total_share - previous total_share'
    estimated_primary_flow: '估算申购赎回金额(万元): share_change * nav; close fallback'
    estimated_primary_flow_basis: '估算价格口径: nav or close_estimate'
  tushare_supplemental:
    # Used only when etf_share_size leaves share/size/NAV fields empty.
    # fund_share.fd_share and etf_share_size.total_share are both in 万份.
    share:
      api: fund_share
      date_field: trade_date
      source_field: fd_share
      target_field: total_share
    nav:
      api: fund_nav
      date_field: nav_date
      source_field: unit_nav
      target_field: nav
    derived:
      total_size: total_share * nav
  benchmarks:
    - target_symbol: '159928'
      theme_tags:
        - "促消费"
      name: 消费
      benchmark_index:
        code: 000932
        name: 中证主要消费指数
