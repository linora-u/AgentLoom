  apis:
    - api: etf_basic
      join_keys:
        - ts_code
      field_aliases:
        name: extname
      output_fields:
        ts_code: TS代码
        name: 名称
        exchange: 交易所
        index_code: 指数代码
    - api: fund_daily
      output_fields:
        ts_code: TS代码
        trade_date: 交易日期
        open: 开盘价(元)
        high: 最高价(元)
        low: 最低价(元)
        close: 收盘价(元)
        pre_close: 昨收盘价(元)
        change: 涨跌额(元)
        pct_chg: 涨跌幅(%)
        vol: 成交量(手)
        amount: 成交额(千元)
    - api: fund_adj
      output_fields:
        ts_code: TS代码
        trade_date: 交易日期
        adj_factor: 复权因子
    - api: etf_share_size
      output_fields:
        trade_date: 交易日期
        ts_code: TS代码
        total_share: 总份额(万份)
        total_size: 规模(万元)
        nav: 基金份额净值(元)
    - api: benchmark_daily
      source_group: true
      source_apis:
        - index_daily
        - idx_factor_pro
        - index_global
        - dc_daily
      join_keys:
        - trade_date
      output_fields:
        trade_date: 交易日期
        idx_open: 指数开盘
        idx_high: 指数最高
        idx_low: 指数最低
        idx_close: 指数收盘
        idx_pre_close: 指数昨收
        idx_change: 指数涨跌点
        idx_pct_chg: 指数涨跌幅(%)
        idx_vol: 指数成交量(原始Tushare接口单位)
        idx_amount: 指数成交额(原始Tushare接口单位)
        idx_source: 指数行情来源接口
        idx_code: 实际使用指数代码
        idx_relation: 指数关系(exact或proxy)
download:
  - etf_dk_merge
