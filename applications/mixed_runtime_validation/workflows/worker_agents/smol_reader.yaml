name: inspect_note
agent_runtime: smolagents
runtime_options:
  smart_summary: false
description: Read the requested release note using your native read tool.
workflow: Read the file in query using read_file. Use an absolute file path. Return
  the actual file token with final_answer.
toolsets: []
tools:
- name: read_file
input_schema:
  type: object
  properties:
    query:
      type: string
      description: Path of the requested note.
  required:
  - query
  additionalProperties: false
