name: "test_shell_audit_log"
agent_runtime: smolagents
description: "Validate shell security audit log — verify that blocked commands produce JSONL events in the current .agentloom run"

model_type: "powerful"

tools:
  - name: "shell_tool"
  - name: "glob_search"
  - name: "grep_search"

shell_settings:
  allowed_commands: ["ls", "cat", "grep", "find", "echo", "wc", "pwd", "head", "tail"]
  allowed_operators: ["|", "&&"]

workflow: |
  # Shell Audit Log Validation Workflow

  Use native structured `shell_tool` calls and retain every actual result or
  error. Never mark PASS from expectation alone.

  1. Run `echo "audit log test"` and require `audit log test` in the result.
  2. Attempt `wget http://example.com` exactly once. Require an error containing
     `Command not allowed: wget`.
  3. Attempt `echo hello ; echo world` exactly once. Require an error containing
     `Operator not allowed: ;`.
  4. Locate the newest current-run audit with
     `ls -dt .agentloom/runs/test_shell_audit/run_*/audit/shell.jsonl | head -1`,
     then call `shell_tool` to read that exact file.
  5. Parse each valid JSON line from the actual audit content. Require a
     `WHITELIST_REJECT` event for `wget http://example.com` whose message lists
     `Allowed commands: cat, echo, find, grep, head, ls, pwd, tail, wc`
     and whose suggestion contains `allowed_commands`.
  6. Require a `WHITELIST_REJECT` event for `echo hello ; echo world` whose
     message lists `Allowed operators: &&, |`, whose suggestion contains
     `allowed_operators`, and whose suggestion does not contain
     `allowed_commands`.
  7. Derive the sibling `logs/runtime.log` path and call `ls` on that exact path
     to prove it exists.
  8. Call `final_answer` with the audit path, runtime log path, and PASS/FAIL
     rows for `SAFE_COMMAND`, `WGET_REJECT`, `OPERATOR_REJECT`,
     `WGET_AUDIT_ENTRY`, `OPERATOR_AUDIT_ENTRY`, and `CO_LOCATION`. Overall is
     PASS only when every row is proven by the actual call or audit event.

worker_agents: []
max_steps: 12
