name: "test_shell_audit_log"
description: "Validate shell security audit log — verify that blocked commands produce audit entries in .logs/{agent_name}/{timestamp}/shell_audit.log"

model_type: "powerful"
tool_call_type: "code_act"

# Tools list declares which tools this agent uses.
tools:
  - name: "shell_tool"
  - name: "read_file"
  - name: "glob_search"
  - name: "grep_search"

# Per-agent shell security override (top-level, not nested under tools).
shell_settings:
  allowed_commands: ["ls", "cat", "grep", "find", "echo", "wc", "pwd", "head", "tail"]
  allowed_operators: ["|", "&&"]

workflow: |
  # Shell Audit Log Validation Workflow

  You are a testing agent. Execute ALL steps below.
  After each step, report PASS or FAIL with a short explanation.

  ## Step 1: Run a safe command
  Use shell_tool to run: echo "audit log test"
  Expected: command succeeds with output "audit log test".

  ## Step 2: Trigger whitelist rejection
  Use shell_tool to run: wget http://example.com
  Expected: command BLOCKED with error about "Command not allowed: wget".
  This is expected behavior — report PASS if you see a whitelist rejection error.

  ## Step 3: Trigger operator rejection
  Use shell_tool to run: echo hello ; echo world
  Expected: command BLOCKED with error about "Operator not allowed: ;".
  This is expected behavior — report PASS if you see an operator rejection error.

  ## Step 4: Verify audit log file exists
  Use glob_search with pattern ".logs/test_shell_audit_log/*/shell_audit.log" to find audit log files.
  Expected: at least one shell_audit.log file found inside a timestamp subdirectory.
  Verify: output contains a file path matching the pattern.

  ## Step 5: Verify audit log content
  If Step 4 found an audit log file, use read_file to read its contents.
  Expected: the file contains at least 2 entries:
    - One [WHITELIST_REJECT] entry for "wget"
    - One [WHITELIST_REJECT] entry for operator ";"
  Verify: each entry has timestamp, agent name, command, message, and suggestion fields.
  Also verify: suggestions reference "allowed_commands" YAML configuration.

  ## Step 6: Verify agent log co-located with audit log
  Use glob_search with pattern ".logs/test_shell_audit_log/*/test_shell_audit_log.log" to find the agent run log.
  Expected: the agent log is in the SAME timestamp directory as the shell_audit.log from Step 4.
  Verify: both files share the same parent directory (timestamp directory).

  ## Final Summary
  Report overall PASS/FAIL status.
  List each step's result and summarize the audit log verification.
  Specifically confirm whether the agent log and shell audit log are co-located in the same timestamp directory.
