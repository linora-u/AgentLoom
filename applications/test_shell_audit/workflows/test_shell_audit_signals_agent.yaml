name: "test_shell_audit_signals"
agent_runtime: smolagents
description: "Validate shell audit log records security, path, whitelist, timeout/background, and stall signals with actionable suggestions"

model_type: "powerful"

tools:
  - name: "shell_tool"
  - name: "check_background_task"
  - name: "kill_background_task"
  - name: "list_background_tasks"

tool_access_control:
  path_validation:
    - tools: ["shell_tool", "read_file"]
      include_paths: []

shell_settings:
  allowed_commands:
    - "cat"
    - "echo"
    - "grep"
    - "head"
    - "ls"
    - "printf"
    - "ps"
    - "pwd"
    - "sleep"
    - "wc"
  allowed_operators: ["|", "&&"]

workflow: |
  # Shell Audit Signals Validation Workflow

  Use native structured tool calls and retain every actual result or error.
  Never invent a PASS row.

  1. Attempt each command once and require the matching error:
     - `wget http://example.com`: `Command not allowed: wget`.
     - `echo hello ; echo world`: `Operator not allowed: ;`.
     - `cat /etc/passwd`: `outside allowed workspace`.
     - `echo $(whoami)`: `command substitution`.
  2. Call `shell_tool` with
     `echo audit_bg_started && sleep 45 && echo audit_bg_done`, timeout 2.
     Require the start marker, a background task id, and promotion evidence.
     Call `kill_background_task` with that exact id and require terminal failure
     or killed evidence.
  3. Call `shell_tool` with `printf "AuditSignal? (y/n) " && sleep 300`,
     timeout 30. Require a foreground `Stall Warning` and no background task id.
  4. Locate the newest current-run `audit/shell.jsonl`, read it through
     `shell_tool`, and parse every valid JSON line.
  5. Require the exact matching audit event and metadata for:
     - `WHITELIST_REJECT` / wget / `allowed_commands`.
     - `WHITELIST_REJECT` / semicolon / `allowed_operators`, without
       `allowed_commands`.
     - `PATH_VIOLATION` / `/etc/passwd` / `path_validation` and
       `include_paths`.
     - `SECURITY_BLOCK` / command substitution /
       `command_substitution: false`.
     - `BACKGROUND_PROMOTION` / `audit_bg_started` / `timeout_seconds` and
       `task_id`.
     - `STALL_DETECTED` / `AuditSignal? (y/n)` / `non-interactive`.
     Treat `SANDBOX_WRAP` as PASS when present and `NOT_APPLICABLE` when absent.
  6. Derive the sibling `logs/runtime.log` and call `ls` to prove it exists.
     Then run
     `ps aux | grep -E "[a]udit_bg_done|[A]uditSignal\? \(y/n\)|[s]leep 300|[s]leep 45" | wc -l`
     and require zero residual processes.
  7. Call `final_answer` with audit/log paths and PASS/FAIL evidence rows for
     every signal, co-location, and process cleanup. Overall is PASS only when
     every non-optional row passed and the sandbox row is PASS or
     NOT_APPLICABLE.

worker_agents: []
max_steps: 40
