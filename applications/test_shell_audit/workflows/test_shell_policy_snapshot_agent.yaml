name: "test_shell_policy_snapshot"
agent_runtime: smolagents
description: "Validate shell audit log records effective all-allow policy even when no command is blocked"

model_type: "powerful"

tools:
  - name: "shell_tool"

task: |
  # Shell Policy Snapshot Audit Validation

  This workflow intentionally uses the default global shell policy, where
  `allowed_commands` and `allowed_operators` are both `"*"`. Use native
  structured `shell_tool` calls and retain every actual result:

  1. Run `echo policy_snapshot_all_allow_ok`; require the marker.
  2. Run `printf 'alpha\nbeta\n' | grep beta`; require `beta`.
  3. Read the current-run audit from the runtime-provided canonical path with
     `cat "$AGENTLOOM_SHELL_AUDIT_PATH"`. Parse each valid JSON line.
  5. Derive the sibling `logs/runtime.log` path and use `shell_tool` with
     `test -f` to prove it exists.
  6. Require one `POLICY_SNAPSHOT` event whose details contain:
     `allowed_commands="* (all command names allowed)"`,
     `allowed_operators="* (all shell operators allowed)"`,
     `command_success_logging="false"`, and a `sandbox_enabled` field.
  7. Require that no event has `event_type=COMMAND_SUCCESS`.
  8. Call `final_answer` with the audit path, runtime log path, and one
     PASS/FAIL row for `SUCCESSFUL_ALLOWED_COMMAND`,
     `ALLOWED_OPERATOR_PIPE`, `POLICY_SNAPSHOT`, `NO_SUCCESS_SPAM`, and
     `CO_LOCATION`. Overall is PASS only when every row is proven by the
     actual command or audit result. Do not mark PASS from expectation alone.

worker_agents: []
runtime_options:
  max_steps: 24
  smart_summary: false
