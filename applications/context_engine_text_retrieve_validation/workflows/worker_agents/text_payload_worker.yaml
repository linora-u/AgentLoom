name: "text_payload_worker"
description: "Worker that returns a large text payload for ContextEngine validation."
model_type: "powerful"
tool_call_type: "code_act"
max_steps: 4

workflow: |
  # Text Payload Worker

  Produce the payload by executing this logic in one code block:

  ```
  payload = make_context_engine_text_payload(case_id="text")
  final_answer(payload)
  ```

  Return the payload exactly. Do not summarize it.

agent_function_schema:
  description: "Return the large text validation payload exactly."
  inputs:
    user_request:
      description: "Validation request from the supervisor."
      required: true
  output:
    description: "The complete large text payload."

tools:
  - name: "make_context_engine_text_payload"
    module: "applications.context_engine_text_retrieve_validation.agent_tools.payload_tools"
    function: "make_context_engine_text_payload"

worker_agents: []
