name: "test_file_rewind"
agent_runtime: smolagents
description: |
  File history rewind integration test.

  Verifies that the FileHistoryManager automatically creates pre-edit
  backups when edit_file is used, and that snapshot files are persisted
  under the checkpoint file-history directory.

  Steps:
  - Step 1: Create /tmp/agentloom_rewind_test/original.txt with known content
  - Step 2: Edit original.txt (replace content)
  - Step 3: Edit original.txt again (second modification)
  - Step 4: Verify the file contains the third version of content
  - Step 5: Report that all edits completed — the test harness will
            verify that file-history backups exist under
            .agentloom/checkpoints/test_demo/<task_id>/file-history/

model_type: "powerful"
runtime_options:
  max_steps: 8
  smart_summary: false

workflow: |
  # File Rewind Test Workflow

  Use native structured tool calls:
  1. Call `shell_tool` to recreate `/tmp/agentloom_rewind_test`.
  2. Call `write_file` for `original.txt` with version 1.
  3. Call `edit_file` once to change version 1 to version 2, then once more to
     change version 2 to version 3. Do not combine or repeat the edits.
  4. Call `read_file` and require `version_3: second modification`.
  5. Call `final_answer` with `FILE_REWIND_VALIDATION: PASS` only when all
     actual returns prove success. Include the actual final content and note
     that the harness must independently verify two pre-edit backups.

tools:
  - name: "shell_tool"
  - name: "read_file"
  - name: "write_file"
  - name: "edit_file"

worker_agents: []
