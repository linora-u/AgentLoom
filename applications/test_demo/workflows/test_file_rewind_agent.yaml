name: "test_file_rewind"
description: |
  File history rewind integration test.

  Verifies that the FileHistoryManager automatically creates pre-edit
  backups when edit_file is used, and that snapshot files are persisted
  under the checkpoint file-history directory.

  Steps:
  - Step 1: Create /tmp/agentloom_rewind_test/original.txt with known content
  - Step 2: Edit original.txt (replace content)
  - Step 3: Edit original.txt again (second modification)
  - Step 4: Verify the file contains the third version of content
  - Step 5: Report that all edits completed — the test harness will
            verify that file-history backups exist under
            .agentloom/checkpoints/test_demo/<task_id>/file-history/

model_type: "powerful"
tool_call_type: "code_act"
max_steps: 5

workflow: |
  # File Rewind Test Workflow

  Execute one Python code block that calls the tools below directly. Do not
  split this into multiple code blocks. Do not output prose outside the code
  block.

  ```python
  path = "/tmp/agentloom_rewind_test/original.txt"
  shell_tool(command="rm -rf /tmp/agentloom_rewind_test && mkdir -p /tmp/agentloom_rewind_test")
  results = []

  created = write_file(file_path=path, content="version_1: original content\n")
  results.append(("write_file original", "Created" in created or "Updated" in created, created))

  first = edit_file(
      file_path=path,
      edits=[{"old_text": "version_1: original content", "new_text": "version_2: first modification"}],
  )
  results.append(("edit_file first", "Successfully edited" in first, first))

  second = edit_file(
      file_path=path,
      edits=[{"old_text": "version_2: first modification", "new_text": "version_3: second modification"}],
  )
  results.append(("edit_file second", "Successfully edited" in second, second))

  final_content = read_file(file_path=path)
  results.append(("read_file final", "version_3: second modification" in final_content, final_content))

  ok = all(item[1] for item in results)
  lines = ["FILE_REWIND_VALIDATION: " + ("PASS" if ok else "FAIL")]
  for name, passed, detail in results:
      lines.append(f"{name}: {'PASS' if passed else 'FAIL'}")
      if not passed:
          lines.append(str(detail))
  lines.append("Final file content:")
  lines.append(final_content)
  lines.append("File history should have created pre-edit backups for each edit_file call.")
  final_answer("\n".join(lines))
  ```

tools:
  - name: "shell_tool"
  - name: "read_file"
  - name: "write_file"
  - name: "edit_file"

worker_agents: []
skills: []

execution_env:
  type: "local"
