name: "test_open_agent"
agent_runtime: smolagents
description: "用于测试 open 函数是否可用的简单 agent"

agent_type: "code"
model_type: "powerful"

task: |
  使用 Python 的 open() 读取 /private/tmp/agentloom_test_open.txt 并打印内容。
  然后在末尾追加一行“测试 open 函数写入成功！”，写回同一文件，
  最后再次读取并打印文件内容以验证写入。不要使用其他工具。

tools: []

runtime_options:
  max_steps: 5
  smart_summary: false
