name: "test_checkpoint"
description: |
  Checkpoint & Resume integration test.

  This agent performs multiple file operations across several steps,
  making it suitable for interrupt/resume testing. Each step creates
  or modifies a file in /tmp/agentloom_checkpoint_test/, allowing
  verification that:
  1. Checkpoint is saved after each step.
  2. Resume skips already-completed steps.
  3. File history backup is created before edits.
  4. Heartbeat file is written during execution.

  Steps:
  - Step 1: Create /tmp/agentloom_checkpoint_test/step1.txt with "Hello from step 1"
  - Step 2: Create /tmp/agentloom_checkpoint_test/step2.txt with "Hello from step 2"
  - Step 3: Edit step1.txt to append " — modified in step 3"
  - Step 4: Use grep_search to verify both files exist and contain expected content
  - Step 5: Create /tmp/agentloom_checkpoint_test/summary.txt with a summary of all steps

  After completion, the test directory should contain:
    step1.txt (modified), step2.txt (original), summary.txt

model_type: "powerful"
tool_call_type: "code_act"
max_steps: 5

workflow: |
  # Checkpoint Resume Test Workflow

  Execute one Python code block that calls the tools below directly. Do not
  split this into multiple code blocks. Do not output prose outside the code
  block.

  ```python
  root = "/tmp/agentloom_checkpoint_test"
  shell_tool(command=f"rm -rf {root} && mkdir -p {root}")
  results = []

  step1 = f"{root}/step1.txt"
  step2 = f"{root}/step2.txt"
  summary = f"{root}/summary.txt"

  r1 = write_file(file_path=step1, content="Hello from step 1\n")
  results.append(("write step1", "Created" in r1 or "Updated" in r1, r1))

  r2 = write_file(file_path=step2, content="Hello from step 2\n")
  results.append(("write step2", "Created" in r2 or "Updated" in r2, r2))

  edited = edit_file(
      file_path=step1,
      edits=[{"old_text": "Hello from step 1", "new_text": "Hello from step 1 — modified in step 3"}],
  )
  results.append(("edit step1", "Successfully edited" in edited, edited))

  step1_content = read_file(file_path=step1)
  step2_content = read_file(file_path=step2)
  results.append(("verify step1", "modified in step 3" in step1_content, step1_content))
  results.append(("verify step2", "Hello from step 2" in step2_content, step2_content))

  summary_result = write_file(
      file_path=summary,
      content="step1 created and modified\nstep2 created\nsummary created\n",
  )
  results.append(("write summary", "Created" in summary_result or "Updated" in summary_result, summary_result))

  ok = all(item[1] for item in results)
  lines = ["CHECKPOINT_VALIDATION: " + ("PASS" if ok else "FAIL")]
  for name, passed, detail in results:
      lines.append(f"{name}: {'PASS' if passed else 'FAIL'}")
      if not passed:
          lines.append(str(detail))
  final_answer("\n".join(lines))
  ```

tools:
  - name: "shell_tool"
  - name: "read_file"
  - name: "write_file"
  - name: "edit_file"

worker_agents: []
skills: []

execution_env:
  type: "local"
