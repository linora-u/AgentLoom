name: "test_tool_call_parsing"
description: |
  Test agent for validating strict AgentLoom tool-call parsing behavior.

model_type: "powerful"
tool_call_type: "tool_call"
max_steps: 4

workflow: |
  # Tool Call Parser Validation

  Execute exactly two structured tool-call steps.

  ## Step 1: Parser test suite
  Use shell_tool once with exactly this command:

  uv run pytest tests/test_tool_call_parsing_patch.py -q

  Do not add `cd`, heredoc, shell redirection, temporary files, or any other command text.

  ## Step 2: Final summary
  Use final_answer to report whether the parser tests passed.
  Do not call any other tool after the pytest command.

tools:
  - name: "shell_tool"

default_loaded_tools: []
worker_agents: []
skills: []
