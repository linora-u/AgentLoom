name: "test_todo_write"
description: "Verify todo_write tool + planning_interval-driven task tracking"

model_type: "powerful"
tool_call_type: "code_act"
planning_interval: 3
max_steps: 5

workflow: |
  # Todo Write Tool Verification

  Execute one Python code block that calls the tools below directly. Do not
  split this into multiple code blocks. Do not output prose outside the code
  block. `todo_write` takes a JSON string.

  ```python
  import json

  results = []
  initial_todos = [
      {"content": "Verify todo_write accepts valid input", "status": "in_progress"},
      {"content": "Test status transitions", "status": "pending"},
      {"content": "Verify disk persistence", "status": "pending"},
      {"content": "Test auto-clear on all completed", "status": "pending"},
  ]
  first = todo_write(todos=json.dumps(initial_todos, ensure_ascii=False))
  results.append(("initial todo_write", "Updated: 4 todos" in first and "1 in progress" in first, first))

  progress_todos = [
      {"content": "Verify todo_write accepts valid input", "status": "completed"},
      {"content": "Test status transitions", "status": "in_progress"},
      {"content": "Verify disk persistence", "status": "pending"},
      {"content": "Test auto-clear on all completed", "status": "pending"},
  ]
  second = todo_write(todos=json.dumps(progress_todos, ensure_ascii=False))
  results.append(("progress todo_write", "1 completed" in second and "1 in progress" in second, second))

  completed_todos = [
      {"content": "Verify todo_write accepts valid input", "status": "completed"},
      {"content": "Test status transitions", "status": "completed"},
      {"content": "Verify disk persistence", "status": "completed"},
      {"content": "Test auto-clear on all completed", "status": "completed"},
  ]
  done = todo_write(todos=json.dumps(completed_todos, ensure_ascii=False))
  results.append(("complete todo_write", "All 4 tasks completed" in done, done))

  ok = all(item[1] for item in results)
  lines = ["TODO_WRITE_VALIDATION: " + ("PASS" if ok else "FAIL")]
  for name, passed, detail in results:
      lines.append(f"{name}: {'PASS' if passed else 'FAIL'}")
      if not passed:
          lines.append(str(detail))
  final_answer("\n".join(lines))
  ```

tools:
  - name: "todo_write"
  - name: "read_file"

worker_agents: []
skills: []

execution_env:
  type: "local"
