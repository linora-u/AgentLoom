name: "test_security_transparency"
agent_runtime: smolagents
description: "Validate security policy transparency: dynamic tool descriptions, enriched denial messages, and environment prompt security section"

model_type: "powerful"

workflow: |
  # Security Policy Transparency Validation Workflow

  Use native structured `shell_tool` calls. Retain every actual result or error:
  1. Run `echo "security transparency test"` and require the marker.
  2. Run `ls -la` and require `README.md`.
  3. Attempt `echo $(whoami)` and require a blocked error containing `Blocked`,
     `command substitution`, `Suggested alternative:`, and `write_file`.
  4. Attempt `sudo ls /root` and require a blocked error containing `Blocked`,
     `sudo`, `Suggested alternative:`, and `without sudo`.
  5. Attempt `rm -rf /` and require a blocked error containing `Blocked`,
     `destructive`, `Suggested alternative:`, and `targeted operations`.
  6. Run `cat README.md | head -5` and require `English`.
  7. Call `final_answer` with a PASS/FAIL evidence table. Overall is PASS only
     if every successful call and every expected denial matched its actual
     return. Never infer a denial or repeat a destructive command.

tools:
  - name: "shell_tool"

worker_agents: []
runtime_options:
  max_steps: 8
  smart_summary: false
