name: "test_security_transparency"
description: "Validate security policy transparency: dynamic tool descriptions, enriched denial messages, and environment prompt security section"

model_type: "powerful"
tool_call_type: "code_act"

workflow: |
  # Security Policy Transparency Validation Workflow

  You are a testing agent. Execute ALL steps below using the provided tools.
  After each step, report PASS or FAIL with a short explanation.

  ## Step 1: shell_tool — normal command succeeds
  Use shell_tool to run: echo "security transparency test"
  Expected: output contains "security transparency test"
  Verify: command executes successfully, output is not empty.

  ## Step 2: shell_tool — list workspace files
  Use shell_tool to run: ls -la
  Expected: output contains a directory listing with file names.
  Verify: command succeeds, output is non-empty.

  ## Step 3: shell_tool — blocked command substitution
  Use shell_tool to run: echo $(whoami)
  Expected: the command should be BLOCKED by security. The error message should contain:
    1. "Blocked" or "command substitution"
    2. "Suggested alternative:" with guidance about using write_markdown_file or edit_file
  Verify: error message contains both the block reason AND an alternative suggestion.

  ## Step 4: shell_tool — blocked sudo
  Use shell_tool to run: sudo ls /root
  Expected: the command should be BLOCKED by security. The error message should contain:
    1. "Blocked" about dangerous shell prefix
    2. "Suggested alternative:" with guidance about running commands directly
  Verify: error message contains both the block reason AND an alternative suggestion.

  ## Step 5: shell_tool — blocked destructive command
  Use shell_tool to run: rm -rf /
  Expected: the command should be BLOCKED by security. The error message should contain:
    1. "Blocked" or "destructive"
    2. "Suggested alternative:" with guidance about targeted operations
  Verify: error message contains both the block reason AND an alternative suggestion.

  ## Step 6: shell_tool — read file with cat (should succeed within workspace)
  Use shell_tool to run: cat README.md | head -5
  Expected: output contains the first 5 lines of README.md.
  Verify: command succeeds, output is non-empty.

  ## Final Summary
  Print a summary table:
  | Step | Tool | Status | Details |
  Report overall: X/6 PASSED.
  
  Also report: for each blocked command (steps 3-5), confirm that the error
  message included BOTH a reason AND a suggested alternative.

tools:
  - name: "shell_tool"

worker_agents: []
skills: []
max_steps: 15

execution_env:
  type: "local"
