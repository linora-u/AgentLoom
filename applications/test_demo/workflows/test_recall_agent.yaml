workflow: |
  # Planning Skill Test Workflow

  ## 任务目标
  Verify that agent-recall-with-files is activated on demand.

  ## 执行步骤
  1. 调用 skill(name="agent-recall-with-files") 获取 Skill 正文。
  2. 使用独立授权的 read_file 读取 README.md 或本文件。
  3. 说明 Skill 激活与工具授权是两个独立边界。

tools:
  - name: "read_file"
  - name: "write_file"
  - name: "edit_file"

worker_agents:
  []

execution_env:
  type: "local"
