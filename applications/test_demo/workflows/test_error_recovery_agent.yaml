name: "test_error_recovery"
agent_runtime: smolagents
description: "Validate native tool-call enforcement, error classification, progressive recovery messages, and error consolidation"

model_type: "powerful"
runtime_options:
  max_steps: 4
  smart_summary: false

workflow: |
  # Error Recovery Validation Workflow

  Execute exactly two structured tool-call steps. Do not use read_file or grep_search.

  ## Step 1: Deterministic repository check
  Use shell_tool once to run this Python script from the repository root:

  python - <<'PY'
  from pathlib import Path

  checks = []
  error_recovery = Path("src/runtime/error_recovery.py").read_text()
  bridge = Path("src/adapters/smolagents/model_turn_bridge.py").read_text()
  loom_mixin = Path("src/adapters/smolagents/loom_mixin.py").read_text()
  compression = Path("src/adapters/smolagents/context_compression.py").read_text()

  categories = ["NATIVE_TOOL_CALL_REQUIRED", "UNKNOWN_TOOL", "ARGUMENT_ERROR"]
  checks.append(("native_error_categories", all(item in error_recovery for item in categories)))
  checks.append(("strict_native_tool_calls", "assistant text is not interpreted as a tool call" in bridge))
  checks.append(("canonical_model_items", "MODEL_ITEMS_RAW_KEY" in bridge))
  checks.append(("no_text_parser_module", not Path("src/adapters/smolagents/models/tool_call_parser.py").exists()))
  checks.append(("consolidate_error_messages", "_consolidate_error_messages" in loom_mixin))
  checks.append(("circuit_breaker_removed", "_inject_parse_error_circuit_breaker" not in loom_mixin))
  checks.append(("error_recovery_imports", "agentloom.runtime.error_recovery" in loom_mixin))
  checks.append(("recent_error_exempt_count", "RECENT_ERROR_EXEMPT_COUNT" in compression))

  for name, ok in checks:
      print(f"{'PASS' if ok else 'FAIL'} {name}")
  if not all(ok for _name, ok in checks):
      raise SystemExit(1)
  PY

  ## Step 2: Final summary
  Use final_answer to summarize whether every printed check passed. If every line starts with PASS, report success.

tools:
  - name: "shell_tool"

toolsets: []
worker_agents: []
