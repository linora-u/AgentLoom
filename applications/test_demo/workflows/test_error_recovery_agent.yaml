name: "test_error_recovery"
description: "Validate error recovery: explicit parser failures, error classification, progressive recovery messages, and error consolidation"

model_type: "powerful"
tool_call_type: "tool_call"
max_steps: 4

workflow: |
  # Error Recovery Validation Workflow

  Execute exactly two structured tool-call steps. Do not use read_file or grep_search.

  ## Step 1: Deterministic repository check
  Use shell_tool once to run this Python script from the repository root:

  python - <<'PY'
  from pathlib import Path

  checks = []
  error_recovery = Path("src/lib/smolagents/error_recovery.py").read_text()
  parser = Path("src/lib/smolagents/models/tool_call_parser.py").read_text()
  loom_mixin = Path("src/lib/smolagents/agent/loom_mixin.py").read_text()
  compression = Path("src/lib/smolagents/memory/context_compression.py").read_text()

  categories = ["FORMAT_NOT_FOUND", "JSON_SYNTAX_ERROR", "UNKNOWN_TOOL", "ARGUMENT_ERROR"]
  checks.append(("four_error_categories", all(item in error_recovery for item in categories)))
  checks.append(("tool_call_parse_error_category", "self.error_category = error_category" in parser))
  checks.append(("strict_parser_entrypoint", "def parse_structured_tool_call(" in parser))
  checks.append(("model_id_parameter", "model_id: str | None = None" in parser))
  checks.append(("no_strategy_cache", "strategy_cache" not in parser))
  checks.append(("no_global_parser_patch", "patch_smolagents_tool_call_parsing" not in parser))
  checks.append(("no_regex_fallback_strategy", "_strategy_regex_extraction" not in parser))
  checks.append(("strict_container_failure", "Could not parse a structured tool call" in parser))
  checks.append(("consolidate_error_messages", "_consolidate_error_messages" in loom_mixin))
  checks.append(("circuit_breaker_removed", "_inject_parse_error_circuit_breaker" not in loom_mixin))
  checks.append(("error_recovery_imports", "src.lib.smolagents.error_recovery" in loom_mixin))
  checks.append(("recent_error_exempt_count", "RECENT_ERROR_EXEMPT_COUNT" in compression))

  for name, ok in checks:
      print(f"{'PASS' if ok else 'FAIL'} {name}")
  if not all(ok for _name, ok in checks):
      raise SystemExit(1)
  PY

  ## Step 2: Final summary
  Use final_answer to summarize whether every printed check passed. If every line starts with PASS, report success.

tools:
  - name: "shell_tool"

default_loaded_tools: []
worker_agents: []
skills: []
