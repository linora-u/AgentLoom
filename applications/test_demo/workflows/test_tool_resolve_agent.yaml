name: "test_tool_resolve"
agent_runtime: smolagents
description: "Validate explicit catalog-backed tool resolution and metadata loading"

model_type: "powerful"
runtime_options:
  max_steps: 5
  smart_summary: false

task: |
  # Tool Resolution Validation

  Use native structured tool calls:
  1. Call `grep_search(pattern="class ToolSpec", path="src/tools/catalog.py")`
     and require `ToolSpec` in the actual result.
  2. Call `glob_search(pattern="*.yaml", path="config/")` and require
     `system.yaml`.
  3. Call `shell_tool(command="echo hello_from_shell")` and require the marker.
  4. Call `read_file(file_path="config/system.yaml", offset=1, limit=20)` and
     require both `AgentLoom` and `System Information`.
  5. Call `final_answer` with `TOOL_RESOLVE_VALIDATION: PASS` only if every
     actual result passed. Include one PASS/FAIL row per tool and failing
     evidence.

tools:
  - name: "grep_search"
  - name: "glob_search"
  - name: "shell_tool"
  - name: "read_file"

worker_agents: []
