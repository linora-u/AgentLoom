name: "test_tool_resolve"
description: "Validate explicit catalog-backed tool resolution and metadata loading"

model_type: "powerful"
tool_call_type: "code_act"
max_steps: 5

workflow: |
  # Tool Resolution Validation

  Execute one Python code block that calls the tools below directly. Do not
  split this into multiple code blocks. Do not output prose outside the code
  block.

  ```python
  results = []

  grep_result = grep_search(pattern="class ToolSpec", path="src/tools/catalog.py")
  results.append(("grep_search", "ToolSpec" in grep_result, grep_result))

  glob_result = glob_search(pattern="*.yaml", path="config/")
  results.append(("glob_search", "system.yaml" in glob_result, glob_result))

  shell_result = shell_tool(command="echo hello_from_shell")
  results.append(("shell_tool", "hello_from_shell" in shell_result, shell_result))

  read_result = read_file(file_path="config/system.yaml", offset=1, limit=20)
  results.append(("read_file", "AgentLoom" in read_result and "System Information" in read_result, read_result))

  ok = all(item[1] for item in results)
  lines = ["TOOL_RESOLVE_VALIDATION: " + ("PASS" if ok else "FAIL")]
  for name, passed, detail in results:
      lines.append(f"{name}: {'PASS' if passed else 'FAIL'}")
      if not passed:
          lines.append(str(detail))
  final_answer("\n".join(lines))
  ```

tools:
  - name: "grep_search"
  - name: "glob_search"
  - name: "shell_tool"
  - name: "read_file"

worker_agents: []
skills: []

execution_env:
  type: "local"
