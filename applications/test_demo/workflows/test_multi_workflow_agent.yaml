name: "test_multi_workflow_agent"
agent_runtime: smolagents
description: |
  Demo agent for sequential list workflows.

model_type: "powerful"
runtime_options:
  max_steps: 3
  smart_summary: false

workflow:
  - |
    # First workflow
    Return exactly:
    FIRST_WORKFLOW_DONE marker=ALPHA17
  - |
    # Second workflow
    This is a new workflow item. Ignore earlier answers.
    Return exactly:
    SECOND_WORKFLOW_DONE marker=BETA29

tools: []
