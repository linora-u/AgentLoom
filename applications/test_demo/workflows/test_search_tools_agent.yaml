name: "test_search_tools"
description: "Validate search & navigation tools (grep_search, glob_search, lsp_find_definition, lsp_find_references, lsp_get_document_symbols)"

model_type: "powerful"
tool_call_type: "code_act"
max_steps: 5

workflow: |
  # Search Tools Validation Workflow

  Execute one Python code block that calls the tools below directly. Do not
  split this into multiple code blocks. Do not output prose outside the code
  block.

  ```python
  file_path = "src/tools/search/grep_tool/grep_tool.py"
  results = []

  globbed = glob_search(pattern="**/*.py", path="src/tools/search/", max_results=50, sort_by="name")
  results.append(("glob_search", "grep_tool.py" in globbed and "glob_tool.py" in globbed and "lsp_tool.py" in globbed, globbed))

  grep_content = grep_search(pattern="def grep_search", path="src/tools/search/")
  results.append(("grep_search content", "grep_tool.py" in grep_content and "def grep_search" in grep_content, grep_content))

  grep_files = grep_search(pattern="import json", path="src/tools/search/", output_mode="files_with_matches")
  results.append(("grep_search files_with_matches", ".py" in grep_files and " | " not in grep_files, grep_files))

  grep_count = grep_search(pattern="def ", path="src/tools/search/", output_mode="count")
  results.append(("grep_search count", ":" in grep_count and any(ch.isdigit() for ch in grep_count), grep_count))

  symbols = lsp_get_document_symbols(file_path=file_path)
  results.append(("lsp_get_document_symbols", "grep_search" in symbols, symbols))

  refs = lsp_find_references(file_path=file_path, line=51, character=5)
  results.append(("lsp_find_references", "references in" in refs and "src/tools/search/grep_tool/__init__.py" in refs, refs))

  definition = lsp_find_definition(file_path=file_path, line=51, character=5)
  results.append(("lsp_find_definition", "grep_tool.py" in definition and "51" in definition, definition))

  ok = all(item[1] for item in results)
  lines = ["SEARCH_TOOLS_VALIDATION: " + ("PASS" if ok else "FAIL")]
  for name, passed, detail in results:
      lines.append(f"{name}: {'PASS' if passed else 'FAIL'}")
      if not passed:
          lines.append(str(detail))
  final_answer("\n".join(lines))
  ```

tools:
  - name: "grep_search"
  - name: "glob_search"
  - name: "lsp_find_definition"
  - name: "lsp_find_references"
  - name: "lsp_get_document_symbols"

worker_agents: []

execution_env:
  type: "local"
