name: "test_search_tools"
agent_runtime: smolagents
description: "Validate search & navigation tools (grep_search, glob_search, lsp_find_definition, lsp_find_references, lsp_get_document_symbols)"

model_type: "powerful"
runtime_options:
  max_steps: 12
  smart_summary: false

workflow: |
  # Search Tools Validation Workflow

  Use native structured tool calls and preserve every actual return:
  1. Call `glob_search` for `**/*.py` under `src/tools/search/`, sorted by name
     with at most 50 results; require the grep, glob, and LSP tool files.
  2. Call `grep_search` for `def grep_search`, `import json` in
     `files_with_matches` mode, and `def ` in `count` mode. Verify each result
     against its requested output contract.
  3. Against `src/tools/search/grep_tool/grep_tool.py`, call
     `lsp_get_document_symbols`, `lsp_find_references` at line 51 character 5,
     and `lsp_find_definition` at the same position. Require the same evidence
     named in this workflow's description.
  4. Call `final_answer` with `SEARCH_TOOLS_VALIDATION: PASS` only if every
     actual result passed; include one PASS/FAIL row per call and failing
     evidence.

tools:
  - name: "grep_search"
  - name: "glob_search"
  - name: "lsp_find_definition"
  - name: "lsp_find_references"
  - name: "lsp_get_document_symbols"

worker_agents: []
