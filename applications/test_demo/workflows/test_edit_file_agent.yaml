name: "test_edit_file"
description: "Validate edit_file tool: multi-edit schema, unique matches, and error handling"

model_type: "powerful"
tool_call_type: "code_act"
max_steps: 5

workflow: |
  # edit_file Tool Validation Workflow

  Execute one Python code block that calls the tools below directly. Do not
  split this into multiple code blocks. Do not output prose outside the code
  block.

  ```python
  path = "/tmp/test_edit_agent.py"
  results = []

  created = write_file(
      file_path=path,
      content="def hello():\n    return 'world'\n\nstatus = 'draft'\n",
  )
  results.append(("write_file create", "Created" in created or "Updated" in created, created))

  initial = read_file(file_path=path)
  results.append(("read_file initial", "def hello():" in initial and "return 'world'" in initial, initial))

  edited = edit_file(
      file_path=path,
      edits=[
          {"old_text": "return 'world'", "new_text": "return 'universe'"},
          {"old_text": "status = 'draft'", "new_text": "status = 'done'"},
      ],
  )
  results.append(("edit_file multi-edit", "Successfully edited" in edited and "(2 edits)" in edited, edited))

  final_content = read_file(file_path=path)
  results.append((
      "read_file final",
      "return 'universe'" in final_content
      and "status = 'done'" in final_content
      and "return 'world'" not in final_content
      and "status = 'draft'" not in final_content,
      final_content,
  ))

  duplicate = edit_file(
      file_path=path,
      edits=[
          {"old_text": "hello", "new_text": "hi"},
          {"old_text": "hello", "new_text": "hey"},
      ],
  )
  results.append(("edit_file duplicate old_text", "Duplicate old_text" in duplicate, duplicate))

  identical = edit_file(
      file_path=path,
      edits=[{"old_text": "hello", "new_text": "hello"}],
  )
  results.append(("edit_file identical text", "identical" in identical, identical))

  ok = all(item[1] for item in results)
  lines = ["EDIT_FILE_VALIDATION: " + ("PASS" if ok else "FAIL")]
  for name, passed, detail in results:
      lines.append(f"{name}: {'PASS' if passed else 'FAIL'}")
      if not passed:
          lines.append(str(detail))
  lines.append("Final file content:")
  lines.append(final_content)
  final_answer("\n".join(lines))
  ```

tools:
  - name: "read_file"
  - name: "write_file"
  - name: "edit_file"
