name: "test_edit_file"
agent_runtime: smolagents
description: "Validate edit_file tool: multi-edit schema, unique matches, and error handling"

model_type: "powerful"
runtime_options:
  max_steps: 10
  smart_summary: false

workflow: |
  # edit_file Tool Validation Workflow

  Use native structured tool calls against `/tmp/test_edit_agent.py`:
  1. Call `write_file` with the initial function and `status = 'draft'`.
  2. Call `read_file` and verify the initial content.
  3. Call `edit_file` once with two edits: change the return value to
     `universe` and status to `done`.
  4. Call `read_file` and verify both old values are absent and both new values
     are present.
  5. Call `edit_file` with two entries sharing the same `old_text`; require the
     actual return to report the duplicate.
  6. Call `edit_file` with identical old/new text; require the actual return to
     report that error.
  7. Call `final_answer` with `EDIT_FILE_VALIDATION: PASS` only if every check
     passed, followed by one row per check and the actual final file content.

tools:
  - name: "read_file"
  - name: "write_file"
  - name: "edit_file"
