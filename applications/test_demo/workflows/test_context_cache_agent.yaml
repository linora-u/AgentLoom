name: "test_context_cache"
agent_runtime: smolagents
description: "Validate that context_cache injection works correctly with the configured LLM model"

model_type: "powerful"

workflow: |
  # Context Cache Validation Workflow

  You are a testing agent. Execute ALL steps below to validate that
  context_cache prompt caching is working correctly.

  ## Step 1: Verify environment
  Use shell_tool to run: echo "Agent started successfully"
  Expected: shell returns the echo message.
  Verify: output contains "Agent started successfully".

  ## Step 2: Read the model-turn adapter source
  Use grep_search to find `_apply_system_prompt_cache` and `cache_control` in
  "src/adapters/litellm/model_turn.py".
  Expected: caching is implemented at the provider protocol adapter boundary.

  ## Step 3: Check LLM config
  Use shell_tool to run: cat config/llm.yaml | grep -A2 "context_cache"
  Expected: see context_cache: true under one or more model types.
  Verify: output shows "context_cache: true".

  ## Step 4: Verify no provider-specific code remains
  Use shell_tool to run: grep -c "is_claude\|is_gpt\|_enable_anthropic_caching\|_enable_openai_caching" src/adapters/litellm/model_turn.py || echo "CLEAN: 0 matches"
  Expected: No provider-specific caching code should exist.
  Verify: output shows "CLEAN: 0 matches" or count is 0.

  ## Step 5: Verify cache_control injection tests
  Use shell_tool to run:
  `.venv/bin/pytest -q tests/test_context_cache.py`
  Expected: all protocol-adapter cache tests pass for OpenAI Chat, OpenAI
  Responses, and Anthropic Messages.

  ## Final Summary
  Print a summary table:
  | Step | Check | Status |
  Report overall: X/5 PASSED.

tools:
  - name: "shell_tool"
  - name: "read_file"
  - name: "grep_search"

worker_agents: []
runtime_options:
  max_steps: 15
  smart_summary: false
