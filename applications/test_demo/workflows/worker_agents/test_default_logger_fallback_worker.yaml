name: "fallback_demo_worker"
agent_runtime: smolagents
runtime_options:
  smart_summary: false
description: |
  默认 logger 回退演示用子 agent。

model_type: "powerful"

task: |
  # Worker Demo Workflow
  1. 接收 supervisor 传入的指令。
  2. 执行 shell_tool。
  3. 返回真实执行结果文本。

input_schema:
  type: object
  properties:
    query:
      type: string
      description: '需要子 agent 执行的 shell 指令描述。

        '
  required:
  - query
  additionalProperties: false
tools:
  - name: "shell_tool"

worker_agents: []
