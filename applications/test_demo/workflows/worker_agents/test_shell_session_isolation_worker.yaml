name: "shell_session_worker"
agent_runtime: smolagents
runtime_options:
  smart_summary: false
description: |
  一个工作 agent，负责验证 shell session 的 CWD 隔离和环境变量非持久化。
model_type: "powerful"
task: |
  # Shell Worker Workflow
  1. 接收 supervisor 的指令
  2. 使用 shell_tool 严格执行 supervisor 要求的 cd、pwd、export、echo 命令
  3. 必须返回每一步真实的指令输出
  4. 如果 `export X=... && echo $X` 同命令有输出，但下一次 `echo $X` 为空，应明确说明 env 不跨调用持久化

input_schema:
  type: object
  properties:
    query:
      type: string
      description: '传递给 worker 的具体 shell 执行指令或任务描述。

        '
  required:
  - query
  additionalProperties: false
tools:
  - name: "shell_tool"

worker_agents: []
