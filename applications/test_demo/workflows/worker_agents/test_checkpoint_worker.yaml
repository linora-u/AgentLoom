name: "file_processor"
agent_runtime: smolagents
description: |
  Worker agent for checkpoint integration test.
  Reads input files from a directory and produces a merged output.

model_type: "powerful"

system_prompt: "You are a file processing worker."
task: |
  # File Processor Worker

  Follow the query instructions exactly.
  Read the specified input files, merge their content, and write the output with write_file.

input_schema:
  type: object
  properties:
    query:
      type: string
      description: 'Instructions for which files to read and what output to produce.

        '
  required:
  - query
  additionalProperties: false
tools:
  - name: "read_file"
  - name: "write_file"
  - name: "edit_file"
  - name: "shell_tool"

worker_agents: []
runtime_options:
  max_steps: 10
  smart_summary: false
