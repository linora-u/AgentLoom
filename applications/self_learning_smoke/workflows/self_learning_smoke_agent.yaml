name: "self_learning_smoke"
description: "Real-LLM smoke test for AgentLoom self-learning foundation tools."

model_type: "powerful"
tool_call_type: "code_act"
max_steps: 12

tools:
  - name: "session_search"
  - name: "session_scroll"
  - name: "memory"
  - name: "skill_manage"
  - name: "shell_tool"
  - name: "read_file"

skills: []
worker_agents: []

workflow: |
  # Self-Learning Foundation Real-LLM Smoke

  Execute the following validation harness in Python code. Use the actual tools,
  not a simulated answer. Finish with final_answer(JSON_STRING).

  Required behavior:
  - Generate a fresh marker beginning with `AL_SELF_LEARNING_SMOKE_`.
  - Search previous session history for `AL_SELF_LEARNING_SMOKE`.
  - Create one memory proposal with the marker.
  - Create one skill proposal package with SKILL.md plus one references/run.json file.
  - Write the marker to /tmp through shell_tool and verify it with read_file.
  - Return a JSON object with marker, prior_session_count, memory_proposal,
    skill_proposal_path, reference_file_written, tmp_file_verified, and ok.

  Use this code shape, adapting only if a tool result requires a small fix:

  ```python
  import json
  import re

  marker = shell_tool(
      command="python - <<'PY'\nfrom datetime import datetime, timezone\nprint('AL_SELF_LEARNING_SMOKE_' + datetime.now(timezone.utc).strftime('%Y%m%d_%H%M%S_%f'))\nPY",
      timeout=10,
  ).strip().splitlines()[-1]
  safe_name = re.sub(r"[^a-z0-9_.-]+", "-", marker.lower()).strip("-")

  prior_raw = session_search(query="AL_SELF_LEARNING_SMOKE", limit=5, scope="all")
  prior = json.loads(prior_raw)
  prior_count = len(prior.get("results", []))

  memory_raw = memory(
      action="propose",
      scope="app",
      kind="fact",
      memory_key=f"self-learning-smoke-{safe_name}",
      text=f"Self-learning smoke marker {marker}; prior_session_count={prior_count}",
  )
  memory_result = json.loads(memory_raw)

  skill_body = f"""---
  name: self-learning-smoke-{safe_name}
  description: Smoke proposal generated by real LLM validation for AgentLoom self-learning.
  ---
  # Self-Learning Smoke

  Marker: {marker}

  Use this only as a generated proposal validation artifact.
  """
  create_raw = skill_manage(
      action="create",
      name=f"self-learning-smoke-{safe_name}",
      content=skill_body,
  )
  create_result = json.loads(create_raw)

  run_record = {
      "marker": marker,
      "prior_session_count": prior_count,
      "memory_result": memory_result,
  }
  write_raw = skill_manage(
      action="write_file",
      name=f"self-learning-smoke-{safe_name}",
      path="references/run.json",
      content=json.dumps(run_record, ensure_ascii=False, indent=2),
  )
  write_result = json.loads(write_raw)

  tmp_path = f"/tmp/{marker}.txt"
  shell_tool(command=f"printf '%s\\n' {marker!r} > {tmp_path!r}", timeout=10)
  tmp_content = read_file(file_path=tmp_path)
  tmp_verified = marker in tmp_content

  result = {
      "marker": marker,
      "prior_session_count": prior_count,
      "memory_proposal": bool(memory_result.get("ok")),
      "memory_id": memory_result.get("candidate_id"),
      "skill_proposal_path": create_result.get("proposal_path"),
      "reference_file_written": bool(write_result.get("ok")),
      "tmp_file_verified": tmp_verified,
      "ok": bool(memory_result.get("ok")) and bool(create_result.get("ok")) and bool(write_result.get("ok")) and tmp_verified,
  }
  print(json.dumps(result, ensure_ascii=False, indent=2))
  final_answer(json.dumps(result, ensure_ascii=False, indent=2))
  ```
