name: architecture_contract_validation_native
description: Repair and independently validate a multi-module checkout repository
  via four Workers.
model_type: powerful
tool_call_type: tool_call
max_steps: 16
todo:
  mode: 'off'
toolsets: []
context_engine:
  min_chars: 80000
  preview_max_chars: 80000
workflow: 'Use the exact JSON payload after "ACCEPTANCE_PAYLOAD=" in the task. You
  orchestrate four real typed Worker tools in this order: repository_investigator,
  change_planner, repair_implementer, independent_verifier. Pass query as a JSON string;
  each next query MUST contain the actual preceding Worker output, not your invented
  answer. If output is JSON fenced in markdown, remove only fences. Do not skip any
  Worker. Each output must preserve workspace and case_nonce. Require independent_verifier.verified=true;
  if false, call repair_implementer with findings then independent_verifier again.
  At most two repair attempts. Finally write reports/final.json using write_workspace_file.
  Its JSON must contain case_nonce, workspace, workers (list of all four exact Worker
  names), generated_tests, test_report (the verifier''s actual report), verified,
  and summary; take artifacts and verdict from actual verifier output. Return the
  exact JSON report. Do not edit source or tests yourself.'
worker_agents:
- path: worker_agents/repository_investigator.yaml
- path: worker_agents/change_planner.md
- path: worker_agents/repair_implementer.yaml
- path: worker_agents/independent_verifier.yaml
tools:
- name: write_workspace_file
  module: applications.architecture_contract_validation.agent_tools.workspace_tools
  function: write_workspace_file
execution_env:
  type: local
  executor_kwargs:
    timeout_seconds: 1200
