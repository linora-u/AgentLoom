name: repository_investigator
agent_runtime: smolagents
description: Architecture contract repository investigator
model_type: powerful
runtime_options:
  max_steps: 24
  todo_mode: 'off'
  smart_summary: false
toolsets: []
context_engine:
  min_chars: 80000
  preview_max_chars: 80000
workflow: Inspect the workspace provided in query (JSON with workspace and case_nonce)
  using inspect_workspace and read_workspace_file. Read CONTRACT.md, all three implementation
  modules, configuration fixtures, and existing tests. Trace the cross-module calls
  and identify concrete contract violations from actual source. Distinguish an empty
  cart from a nonempty zero-priced cart when checking the shipping rule. Do not edit. Return
  one JSON object containing workspace, case_nonce, source_files (paths), findings
  (specific observed defects), and relevant contract cases. Preserve the input nonce
  exactly. Your output feeds the planner; claims must cite source paths.
input_schema:
  type: object
  properties:
    query:
      type: string
      description: JSON result from the previous stage, with absolute workspace and unique case_nonce.
  required:
  - query
  additionalProperties: false
tools:
- name: inspect_workspace
  module: applications.architecture_contract_validation.agent_tools.workspace_tools
  function: inspect_workspace
- name: read_workspace_file
  module: applications.architecture_contract_validation.agent_tools.workspace_tools
  function: read_workspace_file
worker_agents: []
