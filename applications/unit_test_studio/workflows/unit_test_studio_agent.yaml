name: "unit_test_studio_agent"
agent_runtime: smolagents
description: |
  Orchestrate end-to-end pytest generation for function targets and return the final English report.

model_type: "powerful"
runtime_options:
  max_steps: 70
  smart_summary: false

system_prompt:
  path: ../config/prompts/unit_test_studio_agent.md
task: |
  Use this JSON payload exactly:
  {"target_root": ".", "targets": "src/app/validation.py:resolve_input_schema_object", "output_dir": "tests/generated"}

worker_agents:
  - path: "applications/unit_test_studio/workflows/worker_agents/function_intake.yaml"
  - path: "applications/unit_test_studio/workflows/worker_agents/scenario_planner.yaml"
  - path: "applications/unit_test_studio/workflows/worker_agents/pytest_generator.yaml"
  - path: "applications/unit_test_studio/workflows/worker_agents/test_refiner.yaml"
  - path: "applications/unit_test_studio/workflows/worker_agents/delivery_reporter.yaml"
