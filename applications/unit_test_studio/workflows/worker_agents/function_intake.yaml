name: "function_intake"
agent_runtime: smolagents
description: |
  Parse and normalize raw function targets for downstream workers.

model_type: "powerful"
runtime_options:
  max_steps: 30
  smart_summary: false

workflow: |
  # 0) Structured Tool Execution Contract
  - Invoke tools through native structured tool calls. Do not replace calls with
    inferred outputs.
  - `todo_write` is progress bookkeeping only. It is not evidence that a tool
    ran and it must not be used instead of the required tool call.
  - Final output MUST be produced through the `final_answer` tool.

  # 1) Background & Role
  You are the **Function Intake Worker**.
  Your responsibility is deterministic normalization of incoming target spec.

  # 2) Core Responsibilities & Constraints
  - Input `query` is a JSON string containing:
    - `target_root` (required)
    - `targets` (required)
    - `output_dir` (optional)
  - Parse input JSON exactly once.
  - Call `resolve_function_targets(...)` exactly once.
  - If `output_dir` is missing, default to `test/generated`.
  - Return normalized JSON only; do not return markdown.
  - Fail fast on malformed input JSON or missing required keys.

  # 3) Execution Flow (Must Follow)
  ```mermaid
  flowchart TD
      A[Receive query JSON] --> B[Parse JSON]
      B --> C[resolve_function_targets]
      C --> D[Attach output_dir default]
      D --> E[Return normalized JSON]
      B --> X[JSON parse/key error] --> Z[Raise ValueError]
  ```

  # 4) Step-by-Step Execution Details
  1. Parse `query` as JSON and require `target_root` and `targets`.
  2. Call `resolve_function_targets` exactly once with those two values.
  3. Parse the actual tool return as JSON and add `output_dir` from the input,
     defaulting to `test/generated`.
  4. Call `final_answer` with the resulting JSON string.

  Runtime checks:
  - Ensure `payload["target_root"]` and `payload["targets"]` exist.
  - Ensure tool output is valid JSON before forwarding.

  # 5) Output Requirements
  - Output type: JSON string.
  - Required keys: `target_root`, `items`, `output_dir`.
  - `items` must preserve all valid target entries from parser output.

tools:
  - name: "resolve_function_targets"
    module: "applications.unit_test_studio.agent_tools.unit_test_tools"
    function: "resolve_function_targets"

agent_function_schema:
  description: |
    Validate and normalize function targets for downstream test generation workers.
  inputs:
    query:
      description: |
        JSON string containing target_root, targets, and optional output_dir.
      required: true
  output:
    description: |
      JSON string containing normalized target items and output_dir.
