name: "skill_script_probe_agent"
description: "Probe default script execution for shell, Python, and Node skill scripts."

model_type: "powerful"
tool_call_type: "code_act"

workflow: |
  Validate script execution for script-probe:
  1. Call check_skill_dependencies("script-probe").
  2. Run sh scripts/shell_probe.sh.
  3. Run python scripts/python_probe.py.
  4. Run node scripts/node_probe.js.
  5. Confirm every command returns exit code 0 and audit files are written.

tools:
  - name: "check_skill_dependencies"
  - name: "run_skill_script"

skills:
  load-mode: "on-demand"
  items:
    - "applications/skill_script_probe/skills/script-probe"

execution_env:
  type: "local"
