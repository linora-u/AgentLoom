name: "test_shell_control_flow"
agent_runtime: smolagents
description: "Validate integrated shell timeout, background task, foreground stall, and process cleanup behavior"

model_type: "powerful"

tools:
  - name: "shell_tool"
  - name: "check_background_task"
  - name: "kill_background_task"
  - name: "list_background_tasks"

workflow: |
  # Shell Control Flow Stress Workflow

  Use native structured tool calls and only actual outputs as evidence:

  1. Call `shell_tool` with
     `echo auto_bg_started && sleep 45 && echo auto_bg_done`, timeout 2.
     Extract the returned background task id and require both the start marker
     and promotion evidence.
  2. Call `check_background_task` with that exact id. If it is running, call
     `kill_background_task` and require killed/failed evidence. If it is already
     terminal, require completed, failed, or an exit code.
  3. Call `shell_tool` with `sleep 5 && echo explicit_bg_done` and
     `run_in_background=true`. Retain its task id. Poll that same id with
     `check_background_task` until terminal, making no more than 12 calls.
     Require completed status, exit code 0, and `explicit_bg_done`.
  4. Call `shell_tool` with `printf "ControlFlow? (y/n) " && sleep 300`,
     timeout 30. Require a foreground `Stall Warning`, `interactive input`, and
     no background task id.
  5. Run
     `ps aux | grep -E "[a]uto_bg_done|[e]xplicit_bg_done|[C]ontrolFlow\? \(y/n\)|[s]leep 300|[s]leep 45" | wc -l`
     and require zero residual processes.
  6. Call `final_answer` with PASS/FAIL evidence rows for auto promotion,
     monitor/kill, explicit lifecycle, foreground stall detection, and residual
     cleanup. Overall is PASS only when all five actual checks passed.

worker_agents: []
runtime_options:
  max_steps: 20
  smart_summary: false
