name: "memory_reviewer"
agent_runtime: smolagents
description: "Create and verify a proposal-only Application memory candidate."

model_type: "powerful"
runtime_options:
  max_steps: 8
  smart_summary: false

toolsets: []
worker_agents: []

tools:
  - name: "memory"
  - name: "read_file"
  - name: "edit_file"
  - name: "shell_tool"
  - name: "glob_search"
  - name: "grep_search"

input_schema:
  type: object
  properties:
    query:
      type: string
      description: JSON string containing marker, workspace, and history evidence.
  required:
  - query
  additionalProperties: false
task: |
  # Memory Reviewer Worker

  Parse `query`, create one Application memory proposal, verify its public
  pending-candidate result, and return JSON only.

  # Execution Contract
  - Invoke tools through native structured calls.
  - Do not call `skill`.
  - Use the `memory` tool; do not inspect the SQLite DB directly.
  - Application proposals are review candidates, not active memory. Do not try
    to find them through `memory(action="list")`.
  - Return `ok=true` only when the proposal result has a candidate id and reports
    `pending=true`, `state=pending_pre_review`, and `scope=app`.

  # Required Structured Call Flow
  1. Parse `query` and preserve its marker and history counts.
  2. Call `memory` once with `action=propose`, `scope=app`, `kind=fact`, a
     marker-derived key, and evidence text containing the actual counts.
  3. Parse the actual tool result. Return JSON through `final_answer` with
     `ok=true` only when it has a candidate id, `pending=true`,
     `state=pending_pre_review`, `scope=app`, and tool-level `ok=true`.
