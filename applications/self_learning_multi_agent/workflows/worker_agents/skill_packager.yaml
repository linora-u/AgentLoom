name: "skill_packager"
agent_runtime: smolagents
description: "Create a generated skill proposal package with evidence."

model_type: "powerful"
runtime_options:
  max_steps: 10
  smart_summary: false

toolsets: []
worker_agents: []

tools:
  - name: "skill_manage"
  - name: "read_file"
  - name: "edit_file"
  - name: "shell_tool"
  - name: "glob_search"
  - name: "grep_search"

input_schema:
  type: object
  properties:
    query:
      type: string
      description: JSON string containing marker, history, and memory evidence.
  required:
  - query
  additionalProperties: false
workflow: |
  # Skill Packager Worker

  Parse `query`, create one skill proposal package, write an evidence file, read
  the generated files back, and return JSON only.

  # Execution Contract
  - Invoke tools through native structured calls.
  - Do not call `skill`.
  - Use `skill_manage`; do not write directly into active `skills/`.
  - Return `ok=true` only when SKILL.md and references/evidence.json both contain
    the marker.

  # Required Structured Call Flow
  1. Parse `query`, derive a safe lowercase proposal name from the marker, and
     build a valid `SKILL.md` body containing that marker.
  2. Call `skill_manage(action=create)` once, then use its actual
     `proposal_path`.
  3. Call `skill_manage(action=write_file)` for `references/evidence.json`
     containing the marker and exact prior `history`/`memory` evidence.
  4. Read both generated files with `read_file`.
  5. Return evidence JSON through `final_answer`; set `ok=true` only when both
     tool calls succeeded and both files contain the marker.
