name: "skill_packager"
description: "Create a generated skill proposal package with evidence."

model_type: "powerful"
tool_call_type: "code_act"
max_steps: 10

toolsets: []
worker_agents: []

tools:
  - name: "skill_manage"
  - name: "read_file"
  - name: "write_markdown_file"
  - name: "edit_file"
  - name: "shell_tool"
  - name: "glob_search"
  - name: "grep_search"

agent_function_schema:
  description: "Create a skill proposal package and write references/evidence.json."
  inputs:
    query:
      description: "JSON string containing marker, history, and memory evidence."
      required: true
  output:
    description: "JSON evidence for proposal package creation and file write."

workflow: |
  # Skill Packager Worker

  Parse `query`, create one skill proposal package, write an evidence file, read
  the generated files back, and return JSON only.

  # Execution Contract
  - Emit every action as a Python `<code>...</code>` block.
  - Do not use native `<tool_call>` syntax.
  - Do not call `skill`.
  - Use `skill_manage`; do not write directly into active `skills/`.
  - Return `ok=true` only when SKILL.md and references/evidence.json both contain
    the marker.

  # Required Code Shape
  ```python
  import json
  import re

  payload = json.loads(query)
  marker = payload["marker"]
  safe = re.sub(r"[^a-z0-9_.-]+", "-", marker.lower()).strip("-")
  name = f"self-learning-multi-{safe}"

  skill_body = f"""---
  name: {name}
  description: Multi-agent validation proposal for AgentLoom self-learning.
  ---
  # Self-Learning Multi-Agent Validation

  Marker: {marker}

  This package is generated by the multi-subagent functional validation app.
  """
  create_result = json.loads(skill_manage(action="create", name=name, content=skill_body))
  proposal_path = create_result["proposal_path"]

  evidence = {
      "marker": marker,
      "history_ok": payload["history"]["ok"],
      "memory_ok": payload["memory"]["ok"],
      "memory_id": payload["memory"]["memory_id"],
  }
  write_result = json.loads(
      skill_manage(
          action="write_file",
          name=name,
          path="references/evidence.json",
          content=json.dumps(evidence, ensure_ascii=False, indent=2),
      )
  )
  skill_text = read_file(file_path=f"{proposal_path}/SKILL.md", limit=80)
  evidence_text = read_file(file_path=f"{proposal_path}/references/evidence.json", limit=80)

  result = {
      "worker": "skill_packager",
      "marker": marker,
      "proposal_name": name,
      "proposal_path": proposal_path,
      "create_ok": bool(create_result.get("ok")),
      "write_ok": bool(write_result.get("ok")),
      "skill_contains_marker": marker in skill_text,
      "evidence_contains_marker": marker in evidence_text,
      "ok": bool(create_result.get("ok")) and bool(write_result.get("ok")) and marker in skill_text and marker in evidence_text,
  }
  final_answer(json.dumps(result, ensure_ascii=False))
  ```

execution_env:
  type: "local"
  executor_kwargs:
    timeout_seconds: 1200
