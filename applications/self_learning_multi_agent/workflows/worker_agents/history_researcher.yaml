name: "history_researcher"
agent_runtime: smolagents
description: "Search indexed session history and return real event evidence."

model_type: "powerful"
max_steps: 8

toolsets: []
worker_agents: []

tools:
  - name: "session_search"
  - name: "session_scroll"
  - name: "read_file"
  - name: "write_markdown_file"
  - name: "edit_file"
  - name: "shell_tool"
  - name: "glob_search"
  - name: "grep_search"

agent_function_schema:
  description: "Search prior self-learning validation runs and scroll around one hit."
  inputs:
    query:
      description: "JSON string containing marker and workspace."
      required: true
  output:
    description: "JSON evidence with search counts, run ids, and scroll counts."

workflow: |
  # History Research Worker

  Parse `query`, search real canonical session records, scroll around one hit, and
  return JSON only.

  # Execution Contract
  - Invoke tools through native structured calls.
  - Do not call `skill`.
  - Call `session_search` for both `AL_SELF_LEARNING_SMOKE` and `Self-learning smoke marker`.
  - Call `session_scroll` after the first non-empty search result.
  - Return JSON with `ok=true` only when both search terms have at least one hit.

  # Required Structured Call Flow
  1. Parse `query` and retain its marker.
  2. Call `session_search` once for each required term with `limit=5` and
     `scope=all`.
  3. From the first actual non-empty result, call `session_scroll` with its
     `run_id`, numeric event id, `direction=after`, and `window=2`.
  4. Return JSON through `final_answer` containing both search counts, their
     run ids, the scroll count, marker, worker name, and evidence-based `ok`.
