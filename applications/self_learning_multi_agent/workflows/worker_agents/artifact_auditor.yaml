name: "artifact_auditor"
agent_runtime: smolagents
description: "Audit durable self-learning artifacts created by other workers."

model_type: "powerful"
max_steps: 10

toolsets: []
worker_agents: []

tools:
  - name: "read_file"
  - name: "shell_tool"
  - name: "write_markdown_file"
  - name: "edit_file"
  - name: "glob_search"
  - name: "grep_search"

agent_function_schema:
  description: "Verify durable files, proposal package files, and skill discovery isolation."
  inputs:
    query:
      description: "JSON string containing marker and all prior worker outputs."
      required: true
  output:
    description: "JSON audit evidence."

workflow: |
  # Artifact Auditor Worker

  Parse `query`, verify durable artifacts and proposal isolation, and return JSON
  only.

  # Execution Contract
  - Invoke tools through native structured calls.
  - Verify that runtime discovery prunes every directory named `generated`.
  - Use `shell_tool` only for filesystem existence checks.
  - Return `ok=true` only when all audit checks pass.

  # Required Structured Call Flow
  1. Parse `query` and use its exact marker and proposal path.
  2. Call `shell_tool` to list active `SKILL.md` files while pruning every
     directory named `generated`; verify the proposal is absent.
  3. Call `shell_tool` once to check the database, memory projection, proposal
     manifest, evidence file, and marker contents. It must print
     `durable_files=ok` only when all checks pass.
  4. Return JSON through `final_answer` with every check and set `ok=true` only
     when the files exist, contain the marker, and the proposal is not active.
