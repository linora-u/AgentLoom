name: "self_learning_multi_agent"
agent_runtime: smolagents
description: "Multi-subagent functional validation for AgentLoom self-learning."

model_type: "powerful"
runtime_options:
  max_steps: 18
  smart_summary: false

toolsets: []

tools:
  - name: "shell_tool"
  - name: "read_file"
  - name: "edit_file"
  - name: "glob_search"
  - name: "grep_search"

worker_agents:
  - path: "applications/self_learning_multi_agent/workflows/worker_agents/history_researcher.yaml"
  - path: "applications/self_learning_multi_agent/workflows/worker_agents/memory_reviewer.yaml"
  - path: "applications/self_learning_multi_agent/workflows/worker_agents/skill_packager.yaml"
  - path: "applications/self_learning_multi_agent/workflows/worker_agents/artifact_auditor.yaml"

workflow: |
  # Self-Learning Multi-Agent Functional Validation

  Execute a real multi-worker validation of the self-learning foundation. This
  is not a tool presence probe. The supervisor must call every worker tool and
  verify that their returned JSON proves a functional outcome.

  # Execution Contract
  - Invoke every Worker and tool through native structured calls.
  - Do not call `skill`.
  - Do not infer worker results. Call each worker tool exactly once.
  - Preserve every actual Worker return and pass it intact to the next Worker.
  - Return the final JSON string through the `final_answer` tool.
  - The on-disk manifest and the final answer must describe the same final
    state. Do not write `/tmp/<marker>/final_manifest.json` before
    `manifest_path`, `manifest_written`, and final `ok` are set.
  - Do not use `edit_file` or `read_file` for the
    final manifest. Use `shell_tool` with the Python heredoc below.

  # Required Worker Flow
  1. Generate a fresh marker beginning with `AL_SELF_LEARNING_MULTI_`.
  2. Call `history_researcher` to search prior indexed sessions and scroll near
     one hit.
  3. Call `memory_reviewer` to create and verify an Application memory proposal.
  4. Call `skill_packager` to create a skill proposal package and write
     `references/evidence.json`.
  5. Call `artifact_auditor` to verify durable files and prove the generated
     proposal is not in the active skill catalogue.
  6. Write `/tmp/<marker>/final_manifest.json` with all worker outputs and
     read it back to verify `manifest_written=true`.
  7. Return JSON with `ok=true` only when every worker returned `ok=true` and the
     manifest file was written.

  # Required Structured Call Flow
  - Use `shell_tool` to generate a fresh UTC marker with the required prefix and
    create `/tmp/<marker>`.
  - Call each Worker once in the order above. Build each `query` as JSON with
    the marker, workspace, and all exact prior Worker JSON results.
  - Stop if a Worker returns invalid JSON or `ok` is not true.
  - Build the final result object from those exact results. Set
    `manifest_path`, `manifest_written`, and `ok` before writing it.
  - Use one `shell_tool` call to write and validate `final_manifest.json`, then
    a second call to read it back and confirm `manifest_written=true`.
  - Call `final_answer` with the final result JSON.
