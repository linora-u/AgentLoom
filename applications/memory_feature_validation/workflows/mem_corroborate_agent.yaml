name: "mem_corroborate_agent"
description: |
  Propose one durable project fact and report the tool result. This workflow is
  run multiple times to validate cross-run corroboration.

model_type: "summary"
tool_call_type: "code_act"
max_steps: 6

workflow: |
  # Cross-run corroboration validation

  Save EXACTLY this fact (verbatim, no edits) as a project memory proposal:

  ```python
  import json
  raw = memory(action="add", scope="project", content="The nightly export job must start after 02:00 UTC because upstream data only lands at 01:45 UTC")
  result = json.loads(raw)
  final_answer(json.dumps({"proposal": result.get("proposal"), "duplicate": result.get("duplicate", False), "corroborated": result.get("corroborated", False)}))
  ```

tools:
  - name: "memory"

skills: []
worker_agents: []
