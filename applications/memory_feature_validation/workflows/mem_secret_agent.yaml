name: "mem_secret_agent"
description: |
  Fetch a deterministic payload containing short, spaced, and nested secrets.
  Do not repeat its values. Record only a clean completion note so the campaign
  can verify no secret reached SQLite, digest, proposal, snapshot, or artifacts.

model_type: "summary"
tool_call_type: "code_act"
max_steps: 5

workflow: |
  # Recursive redaction validation

  Execute exactly this. Never place `payload` or any of its values in the final
  answer or memory content.

  ```python
  import json
  payload = json.loads(validation_secret_payload(case_id="campaign"))
  safe_fields_preserved = payload.get("sort_key") == "chronological" and payload.get("token_count") == 42
  note = json.loads(memory(
      action="add",
      scope="session",
      content="learned: the recursive redaction validation probe completed",
  ))
  final_answer(json.dumps({
      "payload_received": isinstance(payload, dict),
      "safe_fields_preserved": safe_fields_preserved,
      "note_ok": note.get("ok"),
  }))
  ```

tools:
  - name: "validation_secret_payload"
    module: "applications.memory_feature_validation.agent_tools.validation_probes"
    function: "validation_secret_payload"
  - name: "memory"

skills: []
worker_agents: []
