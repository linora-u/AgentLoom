name: "mem_high_overlap_agent"
description: |
  Propose the exact export pagination fact supplied by the validation
  environment. Paired runs vary a number, path, version, negation, or
  unit/punctuation; every pair must remain separate and neither value may count
  as corroboration for the other.

model_type: "summary"
tool_call_type: "code_act"
max_steps: 5

workflow: |
  # High-overlap contradiction validation

  Execute exactly:

  ```python
  import json
  fact = validation_high_overlap_fact()
  result = json.loads(memory(action="add", scope="project", content=fact))
  final_answer(json.dumps({
      "fact": fact,
      "proposal": result.get("proposal"),
      "duplicate": result.get("duplicate", False),
      "corroborated": result.get("corroborated", False),
  }))
  ```

tools:
  - name: "validation_high_overlap_fact"
    module: "applications.memory_feature_validation.agent_tools.validation_probes"
    function: "validation_high_overlap_fact"
  - name: "memory"

skills: []
worker_agents: []
