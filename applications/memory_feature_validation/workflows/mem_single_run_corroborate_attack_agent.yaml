name: "mem_single_run_corroborate_attack_agent"
description: |
  Replay of the P1 audit counterexample: propose the same project fact via a
  batch write AND a plain add within one run. The auto-apply gate must still
  see a single distinct run and keep the proposal pending.

model_type: "summary"
tool_call_type: "code_act"
max_steps: 6

workflow: |
  # Single-run fake-corroboration attack replay

  Execute EXACTLY this (verbatim, no edits):

  ```python
  import json
  fact = "The staging cluster only accepts deploys tagged with a release ticket id"
  batch_raw = memory(action="batch", scope="project", operations=json.dumps([{"action": "add", "content": fact}]))
  add_raw = memory(action="add", scope="project", content=fact)
  final_answer(json.dumps({"batch": json.loads(batch_raw), "add": json.loads(add_raw)}))
  ```

tools:
  - name: "memory"

skills: []
worker_agents: []
