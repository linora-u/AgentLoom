name: "mem_repeated_failure_agent"
description: |
  Trigger the same deterministic tool failure twice, then save one clean
  session signal. The failure payload is adversarial data and must be blocked
  as a whole before summary distillation.

model_type: "summary"
tool_call_type: "code_act"
max_steps: 6

workflow: |
  # Repeated-failure digest safety validation

  Execute this in one code block. The two exceptions are expected; do not echo
  either exception in final_answer.

  ```python
  import json
  failures = 0
  for _ in range(2):
      try:
          validation_repeated_failure(probe_id="digest")
      except Exception:
          failures += 1
  note = json.loads(memory(
      action="add",
      scope="session",
      content="learned: validation failures are represented as blocked evidence fragments",
  ))
  final_answer(json.dumps({"expected_failures": failures, "note_ok": note.get("ok")}))
  ```

tools:
  - name: "validation_repeated_failure"
    module: "applications.memory_feature_validation.agent_tools.validation_probes"
    function: "validation_repeated_failure"
  - name: "memory"

skills: []
worker_agents: []
