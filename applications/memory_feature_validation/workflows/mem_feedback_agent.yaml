name: "mem_feedback_agent"
description: |
  Fresh observation from this run's logs: the export endpoint responded with
  Content-Type application/json and a JSON body on every call today. Review
  your injected memory snapshot; if a memory contradicts this observation,
  mark that memory as unhelpful with the memory tool, then report what you did.

model_type: "summary"
tool_call_type: "code_act"
max_steps: 8

workflow: |
  # Memory feedback validation

  1. Read the <agentloom_memory_snapshot> block above the task. Identify any
     memory that CONTRADICTS the fresh observation in the task.
  2. Find that memory's id: `memory(action="list", scope="project")` (parse the
     returned JSON; each item has an "id" and a "content" preview).
  3. Mark it unhelpful: `memory(action="feedback", target="<id>", helpful=False)`.
  4. final_answer a JSON object: {"flagged_id": <id or null>, "feedback_result": <parsed tool result>}.

  Only flag a memory that genuinely contradicts the observation. If none does,
  return {"flagged_id": null}.

tools:
  - name: "memory"

skills: []
worker_agents: []
