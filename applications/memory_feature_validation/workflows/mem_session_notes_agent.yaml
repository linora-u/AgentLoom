name: "mem_session_notes_agent"
description: |
  You just finished debugging the nightly report pipeline. Record what you
  learned as session memory notes, then summarize via final_answer.

model_type: "summary"
tool_call_type: "code_act"
max_steps: 8

workflow: |
  # Session-note recording validation

  Record EXACTLY these three notes with the memory tool (scope="session"), one
  call each, then finish. Do not save anything to project or app scope yourself
  — distillation at session end handles durable promotion.

  ```python
  import json
  r1 = memory(action="add", scope="session", content="learned: the report generator emits a UTF-8 BOM that breaks the downstream CSV parser; strip the BOM before upload")
  r2 = memory(action="add", scope="session", content="learned: upstream 502 errors from the metrics API are transient; three retries with exponential backoff always succeeded")
  r3 = memory(action="add", scope="session", content="progress: finished step 3 of 5 of today's pipeline debugging, resuming tomorrow")
  final_answer(json.dumps({"notes_saved": [json.loads(r1).get("ok"), json.loads(r2).get("ok"), json.loads(r3).get("ok")]}))
  ```

tools:
  - name: "memory"

skills: []
worker_agents: []
