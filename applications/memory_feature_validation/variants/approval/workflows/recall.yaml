name: "memory_review_approval_recall"
description: "Verify whether an approved or rejected fact appears in the next run."
model_type: "summary"
tool_call_type: "tool_call"
max_steps: 5

workflow: |
  Load the follow-up with `validation_memory_case`. Answer only from the
  persistent snapshot supplied at run start. Return exactly one JSON object
  with key `answer`; use the literal string `MISSING` when the fact is absent.

tools:
  - name: "validation_memory_case"
    module: "applications.memory_feature_validation.agent_tools.validation_probes"
    function: "validation_memory_case"

toolsets: []
skills: []
worker_agents: []
