name: "browser_harness_probe"
agent_runtime: smolagents
description: "Run browser-harness doctor, then verify both isolated Chrome and real Chrome demo probes."
model_type: "powerful"
runtime_options:
  max_steps: 8
  smart_summary: false
toolsets: []

tools:
  - name: "browser_harness_doctor"
    module: "applications.browser_harness_probe.agent_tools.browser_harness_tools"
    function: "browser_harness_doctor"
    description: "Run browser-harness --doctor and return JSON diagnostics."
  - name: "run_isolated_demo_probe"
    module: "applications.browser_harness_probe.agent_tools.browser_harness_tools"
    function: "run_demo_probe"
    fixed_args:
      browser_mode: "isolated"
      url: "https://github.com/browser-use/browser-harness"
      timeout_seconds: "90"
    description: "Open the browser-harness GitHub page in an isolated Chrome profile and return page_info JSON."
  - name: "run_real_demo_probe"
    module: "applications.browser_harness_probe.agent_tools.browser_harness_tools"
    function: "run_demo_probe"
    fixed_args:
      browser_mode: "real"
      url: "https://github.com/browser-use/browser-harness"
      timeout_seconds: "90"
    description: "Open the browser-harness GitHub page in the user's real Chrome and return page_info JSON."
  - name: "run_browser_harness_python"
    module: "applications.browser_harness_probe.agent_tools.browser_harness_tools"
    function: "run_browser_harness_python"
    description: "Run custom Python code through browser-harness. Use only when the user asks for a custom browser script."

worker_agents: []

system_prompt:
  path: ../config/prompts/browser_harness_probe.md

task: |
  Run browser-harness doctor, then verify both isolated Chrome and real Chrome
  demo probes. Use the fixed demo probe tools.
