name: "dir_architecture_analysis"
agent_runtime: smolagents
runtime_options:
  smart_summary: false
description: |
  对单个目录进行 LLM 架构分析。
  接收 dir_path 和 index_content（由调用方前置读取），
  返回 Markdown 格式的架构分析文本（由调用方后置写入 analysis.md）。
  不做文件读写，只做分析。

model_type: "powerful"
concurrency: auto

system_prompt:
  path: ../../config/prompts/dir_architecture_analysis.md
task: 基于本次传入的 dir_path、index_content 和 children_analyses 分析目录架构，按上述格式返回 Markdown。

tools: []

input_schema:
  type: object
  properties:
    dir_path:
      type: string
      description: 要分析的相对目录路径，如 "src/utils" 或 "(root)"（项目根目录），用于标题
    index_content:
      type: string
      description: 该目录 index.md 的完整文本内容，由调用方前置读取传入
    children_analyses:
      type: string
      description: '该目录直接子目录的架构分析全文，多个子目录用 --- 分隔。

        由调用方收集已完成分析的子目录 analysis.md 内容拼接而成。

        为空字符串时表示无已分析的子目录（叶子目录或子目录均未完成分析）。

        '
  required:
  - dir_path
  - index_content
  additionalProperties: false
