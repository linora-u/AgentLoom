name: "skill_runtime_probe_agent"
description: "Probe AgentLoom skill load modes, catalogue loading, eager loading, resources, and script execution."

model_type: "powerful"
tool_call_type: "code_act"

workflow: |
  Validate the configured skills:
  1. Call list_skills(detail="full") and confirm both local-probe and eager-probe are registered.
  2. For local-probe, call load_skill with an argument string and follow the loaded instructions.
  3. Call read_skill_resource on local-probe references/guide.md.
  4. Call run_skill_script on local-probe with: sh scripts/write_artifact.sh.
  5. Confirm eager-probe was already loaded in the system prompt and does not need load_skill.

tools:
  - name: "list_skills"
  - name: "load_skill"
  - name: "read_skill_resource"
  - name: "check_skill_dependencies"
  - name: "run_skill_script"

skills:
  load-mode: "on-demand"
  items:
    - "applications/skill_runtime_probe/skills/local-probe"
    - path: "applications/skill_runtime_probe/skills/eager-probe"
      load-mode: "eager"

execution_env:
  type: "local"
