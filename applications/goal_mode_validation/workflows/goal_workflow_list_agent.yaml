name: "goal_workflow_list_agent"
agent_runtime: smolagents
description: "Validate explicit Goal completion and Goal-mode workflow-list merging."
model_type: "powerful"
runtime_options:
  max_steps: 20
  smart_summary: false
goal:
  enabled: true

workflow:
  - "Call run_goal_audit_batch for worker_name=contract, concurrency=1, and one task config_contract covering strict config, stable goal_id, and numbered list semantics; retain its completed result."
  - "Call run_goal_audit_batch for worker_name=lifecycle, concurrency=1, and one task lifecycle_contract covering normal-final continuation, max_steps continuation, explicit completion, and stable identity on resume; retain its completed result."
  - "Call run_goal_audit_batch for worker_name=observability, concurrency=1, and one task observability_contract covering manifest, JSONL, schedule completion, Studio, and disabled-mode zero-impact agreement; retain its completed result."
  - "Send the three results to goal_evidence_synthesizer, persist them as run_name workflow_list, and verify markers [\"# Goal Mode Validation\", \"## Configuration Contract\", \"## Verdict\"]."
  - "Call get_goal, verify the goal_id and active state, then call update_goal(status=\"complete\", evidence=<report path and verification result>). Do not treat final_answer or Todo as completion."

tools:
  - name: "run_goal_audit_batch"
    module: "applications.goal_mode_validation.agent_tools.report_tools"
    function: "run_goal_audit_batch"
  - name: "persist_goal_validation_report"
    module: "applications.goal_mode_validation.agent_tools.report_tools"
    function: "persist_goal_validation_report"
  - name: "verify_goal_validation_report"
    module: "applications.goal_mode_validation.agent_tools.report_tools"
    function: "verify_goal_validation_report"

worker_agents:
  - path: "applications/goal_mode_validation/workflows/worker_agents/evidence_synthesizer.yaml"
