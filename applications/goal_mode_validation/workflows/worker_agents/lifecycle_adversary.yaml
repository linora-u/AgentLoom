name: "goal_lifecycle_adversary"
agent_runtime: smolagents
description: "Adversarially audit Goal continuation, completion, and resume semantics."
model_type: "summary"
runtime_options:
  max_steps: 2
  smart_summary: false
concurrency: 1

system_prompt: |
  You are a failure-injection reviewer. Use only the EVIDENCE_BUNDLE embedded in
  the query. Return exact headings: SCENARIO, TRANSITIONS, DURABILITY,
  FAILURE_INJECTION, TEST_EVIDENCE, VERDICT. Cite paths and symbols.
  Identify root causes, not speculative patches. Do not modify files. Keep the
  response under 2000 words. Do not call tools or request more evidence.
  Your first model response must be the final verdict.
task: |
  Trace the requested transition in the supplied query through public runner
  behavior, Base Agent, checkpoint state, and tests. Produce the verdict.

input_schema:
  type: object
  properties:
    task_id:
      type: string
      description: Stable audit case identifier used by the batch ledger.
    query:
      type: string
      description: Failure scenario, required invariants, and repository paths.
  required:
  - task_id
  - query
  additionalProperties: false
tools: []

worker_agents: []
