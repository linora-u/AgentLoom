name: "tool_registry_core_validation"
agent_runtime: smolagents
description: "Validate default built-in catalog toolsets through real tool calls."

model_type: "powerful"
max_steps: 12

workflow: |
  # Built-in Tool Catalog Core Validation

  Use native structured tool calls and retain every actual return:
  1. Call `shell_tool` to recreate
     `/tmp/agentloom_tool_registry_core_validation`.
  2. Call `write_file` for `result.txt` with exactly three lines:
     `alpha one`, `beta two`, and `gamma three`.
  3. Call `edit_file` once with two edits: `alpha one` to `ALPHA one`, and
     `gamma three` to `GAMMA three`.
  4. The search root is pinned by Application `fixed_args`. Call these exact
     model-visible structured operations:
     - `read_file(file_path="/tmp/agentloom_tool_registry_core_validation/result.txt")`
     - `glob_search(pattern="*.txt")`
     - `grep_search(pattern="GAMMA")`
     - `list_directory(directory_path="/tmp/agentloom_tool_registry_core_validation")`
  5. Mark each named tool PASS only when its actual return proves the requested
     effect. Call `final_answer` with `CORE_TOOL_REGISTRY_VALIDATION: PASS` only
     when every row passed, followed by one PASS/FAIL row per tool and the
     actual final file content.

tools:
  - name: "glob_search"
    fixed_args:
      path: "/tmp/agentloom_tool_registry_core_validation"
  - name: "grep_search"
    fixed_args:
      path: "/tmp/agentloom_tool_registry_core_validation"
