name: "skill_github_probe_agent"
description: "Probe GitHub-hosted Claude/Pi style skills with real loading, dependency checks, and script execution."

model_type: "powerful"
tool_call_type: "code_act"

workflow: |
  Validate GitHub skills by running the bundled runner:
  1. Load github-probe-runner.
  2. Confirm the application-local system config exists at applications/skill_github_probe/config/system.yaml.
  3. Run python scripts/fetch_and_validate_skills.py with run_skill_script.
  4. Read applications/skill_github_probe/reports/skill_validation_report.md and summarize pass/diagnostic/fail causes.

tools:
  - name: "load_skill"
  - name: "read_skill_resource"
  - name: "run_skill_script"

skills:
  load-mode: "on-demand"
  items:
    - "applications/skill_github_probe/skills/github-probe-runner"

execution_env:
  type: "local"
