name: "context_engine_json_retrieve_validation"
agent_runtime: smolagents
description: "Validate that a supervisor can retrieve original worker JSON through ContextRef."
model_type: "powerful"
max_steps: 8

workflow: |
  # ContextEngine JSON Retrieval Validation

  Execute these steps in order.

  1. Call json_payload_worker with user_request:
     "Return the large JSON validation payload exactly."
  2. The worker result must contain a ContextRef marker. Do not infer the hidden
     value from the task.
  3. Call loom_retrieve_context with the ContextRef returned by the worker.
     The Application fixes the query and pagination parameters.
  4. Final answer must be exactly:
       JSON_CONTEXT_RETRIEVE_PASS verification_value=<value>

tools:
  - name: "loom_retrieve_context"
    fixed_args:
      query: "verification_value"
      offset: 0
      limit: 30

worker_agents:
  - path: "applications/context_engine_json_retrieve_validation/workflows/worker_agents/json_payload_worker.yaml"
