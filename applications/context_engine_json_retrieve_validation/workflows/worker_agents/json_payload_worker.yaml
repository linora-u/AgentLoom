name: "json_payload_worker"
agent_runtime: smolagents
description: "Worker that returns a large JSON payload for ContextEngine validation."
model_type: "powerful"
max_steps: 4

workflow: |
  # JSON Payload Worker

  1. Call `make_context_engine_json_payload` exactly once through its native
     structured tool call with `case_id: "json"`.
  2. The large tool result is replaced with a `[ContextRef ctx_...]` preview.
     Extract the `ctx_...` reference without retrieving the original payload.
  3. Call `final_answer` exactly once with only that ContextRef.

agent_function_schema:
  description: "Create the large JSON validation payload and return its ContextRef."
  inputs:
    user_request:
      description: "Validation request from the supervisor."
      required: true
  output:
    description: "The ContextRef for the complete large JSON payload."

tools:
  - name: "make_context_engine_json_payload"
    module: "applications.context_engine_json_retrieve_validation.agent_tools.payload_tools"
    function: "make_context_engine_json_payload"

worker_agents: []
