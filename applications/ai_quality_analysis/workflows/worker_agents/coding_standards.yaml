name: "coding_standards"
agent_runtime: smolagents
runtime_options:
  smart_summary: false
description: "Analyzes code for naming conventions, formatting, magic numbers, dead code, and duplication issues."
model_type: "powerful"
toolsets:
  - "core_shell"
  - "core_file"
  - "core_search"
  - "context"
  - "skills"
system_prompt:
  path: ../../config/prompts/coding_standards.md
task: "Review the supplied project and module context for coding standards issues, then write the complete findings to temp/QA_CodingStandards.md."

input_schema:
  type: object
  properties:
    query:
      type: string
      description: 'Analysis task description with target module/files and project context.

        '
  required:
  - query
  additionalProperties: false
