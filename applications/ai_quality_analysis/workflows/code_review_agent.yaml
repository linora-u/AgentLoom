  - path: "applications/ai_quality_analysis/workflows/worker_agents/error_handling.yaml"
  - path: "applications/ai_quality_analysis/workflows/worker_agents/concurrency_safety.yaml"
  - path: "applications/ai_quality_analysis/workflows/worker_agents/security_scan.yaml"
  - path: "applications/ai_quality_analysis/workflows/worker_agents/performance_analysis.yaml"
