name: "code_review_agent"
agent_runtime: smolagents
runtime_options:
  smart_summary: false
description: |
  Universal Code Review Supervisor Agent. Orchestrates a comprehensive, multi-dimensional
  code quality review by coordinating specialized worker agents across 12 analysis stages:
  project scan, coding standards, error handling, concurrency safety, security, performance,
  architecture, scenario coverage, testability, documentation, recommendations, and final report.

model_type: "powerful"

system_prompt:
  path: ../config/prompts/code_review_agent.md
task: |
  Review the project available in this Application. Call get_module_context() to
  determine the target files, then coordinate the configured Worker stages and
  deliver the evidence-backed final code review report.

tools:
  - name: "get_module_context"
    module: "applications.ai_quality_analysis.agent_tools.module_context_generator"
    function: "get_module_context"
    description: "Retrieve module context including module description and related code file list. Must be called before any worker agent."

worker_agents:
  - path: "project_scan.yaml"
  - path: "applications/ai_quality_analysis/workflows/worker_agents/coding_standards.yaml"
  - path: "applications/ai_quality_analysis/workflows/worker_agents/error_handling.yaml"
  - path: "applications/ai_quality_analysis/workflows/worker_agents/concurrency_safety.yaml"
  - path: "applications/ai_quality_analysis/workflows/worker_agents/security_scan.yaml"
  - path: "applications/ai_quality_analysis/workflows/worker_agents/performance_analysis.yaml"
  - path: "applications/ai_quality_analysis/workflows/worker_agents/architecture_review.yaml"
  - path: "applications/ai_quality_analysis/workflows/worker_agents/scenario_coverage.yaml"
  - path: "applications/ai_quality_analysis/workflows/worker_agents/testability_review.yaml"
  - path: "applications/ai_quality_analysis/workflows/worker_agents/documentation_review.yaml"
  - path: "applications/ai_quality_analysis/workflows/worker_agents/recommendations.yaml"
  - path: "applications/ai_quality_analysis/workflows/worker_agents/report_integration.yaml"
