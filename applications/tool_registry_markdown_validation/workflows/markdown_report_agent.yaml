name: "tool_registry_markdown_validation"
agent_runtime: smolagents
description: "Validate explicit catalog markdown_report toolset through real tool calls."

model_type: "powerful"
toolsets:
  - "core_file"
  - "markdown_report"
max_steps: 5

workflow: |
  # Built-in Tool Catalog Markdown Validation

  Use native structured tool calls and do not simulate results:
  1. Call `write_markdown_file` for
     `/tmp/agentloom_tool_registry_markdown_validation/report.md` with title
     `Built-in Tool Catalog Markdown Validation` and two sections:
     `Summary` / `markdown_report toolset is explicitly enabled.` and
     `Result` / `MARKDOWN_TOOLSET_VALIDATION: PASS`.
  2. Call `read_file` on that exact path.
  3. Call `final_answer` with `MARKDOWN_TOOLSET_VALIDATION: PASS` and the output
     path only when the write return reports success and the read-back contains
     both the title and result marker. Otherwise return FAIL with actual
     evidence.
