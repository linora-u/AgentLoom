name: "nested_discovery_acceptance_worker"
agent_runtime: smolagents
description: "Return a fixed token for nested discovery functional acceptance."
model_type: "powerful"
runtime_options:
  max_steps: 3
  smart_summary: false

workflow: |
  Return exactly the token requested by the query. Do not add any other text.

input_schema:
  type: object
  properties:
    query:
      type: string
      description: The exact token request.
  required:
  - query
  additionalProperties: false
worker_agents: []
