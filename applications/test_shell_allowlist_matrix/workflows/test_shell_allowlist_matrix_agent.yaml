name: "test_shell_allowlist_matrix"
agent_runtime: smolagents
description: "Validate explicit partial shell allow-list enforcement and audit evidence"

model_type: "powerful"

tools:
  - name: "shell_tool"

shell_settings:
  allowed_commands:
    - "cat"
    - "echo"
    - "grep"
    - "ls"
    - "printf"
    - "pwd"
    - "wc"
  allowed_operators: ["|", "&&"]

workflow: |
  # Shell Allow-list Matrix Validation

  This Agent intentionally allows only cat, echo, grep, ls, printf, pwd, and
  wc, plus the `|` and `&&` operators. Use native structured `shell_tool` calls
  and retain every actual result or error.

  1. Run these allowed commands once each and require the stated evidence:
     - `echo allow_matrix_ok` contains `allow_matrix_ok`.
     - `pwd` returns an absolute path.
     - `printf "alpha\nbeta\n" | grep beta` contains `beta`.
     - `echo allow_pipe_marker | wc -c` contains `18`.
  2. Attempt these blocked commands once each:
     - `date`, `whoami`, and `uname -a` must report
       `Allowed commands: cat, echo, grep, ls, printf, pwd, wc`.
     - `echo first ; echo second` must report `Allowed operators: &&, |`.
  3. Read the current audit from the runtime-provided canonical path with
     `cat "$AGENTLOOM_SHELL_AUDIT_PATH"`.
  4. Parse every valid JSON line. Require one `POLICY_SNAPSHOT` whose details
     contain the exact allowed command list, `allowed_operators="|, &&"`, and
     `command_success_logging="false"`.
  5. Require one `WHITELIST_REJECT` for each blocked command. Command rejects
     must suggest `allowed_commands`; the semicolon reject must suggest
     `allowed_operators` and must not suggest `allowed_commands`.
  6. Require that no event has `event_type=COMMAND_SUCCESS`.
  7. Derive the sibling `logs/runtime.log` path and call `ls` on that exact path
     to prove co-location.
  8. Call `final_answer` with the audit path, runtime log path, policy evidence,
     and PASS/FAIL rows for all 16 named checks from the commands and audit
     events. Overall is PASS only when every row is proven by actual evidence.
     Never mark PASS from expectation alone.

worker_agents: []
runtime_options:
  max_steps: 24
  smart_summary: false
