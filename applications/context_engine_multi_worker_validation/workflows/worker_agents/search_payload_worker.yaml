name: "search_payload_worker"
agent_runtime: smolagents
description: "Worker that returns a large search payload for ContextEngine validation."
model_type: "powerful"
runtime_options:
  max_steps: 4
  smart_summary: false

workflow: |
  # Search Payload Worker

  1. Call `make_context_engine_search_payload` exactly once through its native
     structured tool call with `case_id: "search"`.
  2. The large tool result is replaced with a `[ContextRef ctx_...]` preview.
     Extract the `ctx_...` reference without retrieving the original payload.
  3. Call `final_answer` exactly once with only that ContextRef.

agent_function_schema:
  description: "Create the large search validation payload and return its ContextRef."
  inputs:
    user_request:
      description: "Validation request from the supervisor."
      required: true
  output:
    description: "The ContextRef for the complete large search payload."

tools:
  - name: "make_context_engine_search_payload"
    module: "applications.context_engine_multi_worker_validation.agent_tools.payload_tools"
    function: "make_context_engine_search_payload"

worker_agents: []
